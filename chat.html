<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<title>nujeahmik · 모루믹</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ══════════════════════════════════════════════════════════════
   색과 모양 — 누제믹 웹페이지와 같은 톤입니다.
   연한 라벤더 바탕 · 흰 카드 · 파스텔 원형 · 둥근 알약 버튼
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 브랜드 파스텔 */
  --pink:#F5679B;   --teal:#3FC7B4;   --yellow:#FBCF4B;
  --purple:#A98BEE; --blue:#8CB4F0;
  /* 버튼용 조금 더 부드러운 톤 */
  --pinkL:#F291AE;  --tealL:#7ED4C0;  --yellowL:#FBD46D;
  --purpleL:#B296EE;--blueL:#8CB4F0;
  /* 글자 */
  --ink:#1A1A1E; --ink2:#4A4A52; --grey:#8E8E96; --sep:#C4C4CE;
  /* 바탕과 선 */
  --paper:#F5F4F8; --light:#EFEEF4; --line:#E8E7EE; --white:#fff;
  --pinksoft:#FDEDF3; --tealsoft:#E4F7F3;
  /* 그림자 — 아주 옅게 두 겹 */
  --sh1:0 1px 3px rgba(30,30,60,.045), 0 6px 16px rgba(30,30,60,.055);
  --sh2:0 2px 6px rgba(30,30,60,.05), 0 14px 34px rgba(30,30,60,.08);
  /* 모서리 */
  --r-card:20px; --r-row:16px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",
    -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.65;letter-spacing:-.015em;
  word-break:keep-all;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

#app{position:relative;width:100%;max-width:460px;margin:0 auto;
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:var(--paper);overflow:hidden}
@media(min-width:520px){
  body{display:flex;align-items:center;justify-content:center;background:#E9E8EF}
  #app{height:880px;height:min(880px,96dvh);border-radius:30px;box-shadow:var(--sh2)}
}
/* 모서리에서 살짝 삐져나온 파스텔 원 — 웹페이지의 장식과 같습니다 */
.blob{position:absolute;border-radius:50%;pointer-events:none;z-index:0;opacity:.28;
  filter:blur(2px)}
.blob i{position:absolute;background:#fff;border-radius:50%;display:block}

/* ── 떠 있는 컨트롤 (헤더 바 없음) ── */
#ctl{position:absolute;top:0;left:0;right:0;z-index:8;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;
  display:flex;align-items:center;gap:8px;pointer-events:none}
#ctl>*{pointer-events:auto}
/* 브랜드는 흰 알약 안에 — 웹페이지와 같은 모양입니다 */
#ctl .mark{font-weight:800;font-style:italic;font-size:14px;letter-spacing:-.03em;
  background:var(--white);border-radius:var(--r-pill);padding:7px 15px;
  box-shadow:var(--sh1);color:var(--ink)}
#ctl .status{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  background:var(--tealsoft);color:var(--teal)}
#ctl .status.off{background:var(--light);color:var(--grey)}
#ctl .sp{margin-left:auto}
.gbtn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.82);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:var(--ink2)}
.gbtn:active{transform:scale(.92)}
.gbtn.lang{width:auto;padding:0 11px;border-radius:999px}

/* ══ 인형이 주인공 ══ */
#hero{position:relative;z-index:2;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:60px 22px 0}

/* 말 — 박스 없이 글자만 */
#speech{flex:0 0 auto;min-height:0;width:100%;max-width:340px;
  font-size:17.4px;line-height:1.66;letter-spacing:-.01em;color:var(--ink);
  text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:2px 2px 8px;margin-bottom:14px;
  animation:rise .42s cubic-bezier(.2,.9,.3,1.15) both}
#speech::-webkit-scrollbar{width:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#speech b{font-weight:600}
#speech .sub{display:block;color:var(--grey);font-size:14.4px;margin-top:6px}
#speech em{font-style:normal;color:var(--pink);font-weight:600}

/* 인형 */
/* 인형은 말풍선을 놓고 남는 만큼만 차지합니다.
   높이를 고정하면 좁은 화면에서 말풍선을 밀어 올려 잘립니다. */
#char{position:relative;flex:1 1 auto;min-height:120px;
  max-height:clamp(200px,42vh,340px);
  display:flex;align-items:flex-end;justify-content:center;
  transition:max-height .42s cubic-bezier(.2,.9,.3,1.1)}
#char .inner{max-height:100%}
#char img,#char svg,#char .rig{display:block;height:100%;max-height:100%;width:auto;
  transform-origin:50% 100%;
  transition:transform .42s cubic-bezier(.2,.9,.3,1.1)}
/* .rig 은 몸통 너비만큼만 차지해야 합니다.
   가로로 늘어나면 팔·다리 조각이 왼쪽 끝으로 밀려나
   인형이 뒤에 하나 더 있는 것처럼 흐릿하게 겹쳐 보입니다. */
#char .rig{flex:0 0 auto;margin:0}
#char img.base{}
/* 그림자를 완전히 없앴기 때문에, 레이어를 강제로 따로 띄우던 코드도 없앴습니다.
   조각마다 별도 레이어로 분리하면 브라우저에 따라 조각 사이 경계에
   머리카락 같은 얇은 틈(이음새)이 보일 수 있어, 그냥 한 레이어로 같이 그리게 둡니다. */

/* ── 리깅 ── */
.rig{position:relative}
.rig img{height:100%;width:auto}
.rig.parts img{position:absolute;left:0;top:0;height:100%;width:auto}
.rig.parts img.base{position:relative}
/* 팔·다리처럼 계속 회전하는 조각들은 브라우저가 자체 레이어로 합성하도록
   힌트를 줘야 이전 프레임이 지워지지 않고 남는 잔상(고스트)이 생기지 않습니다. */
#char .inner,#char .p,#splashAv img{will-change:transform;backface-visibility:hidden;transform:translateZ(0)}
@keyframes swayL{0%{transform:rotate(-3.2deg)}100%{transform:rotate(3.6deg)}}
@keyframes swayR{0%{transform:rotate(3.2deg)}100%{transform:rotate(-3.6deg)}}
@keyframes stepL{0%{transform:rotate(-1.3deg)}100%{transform:rotate(1.5deg)}}
@keyframes stepR{0%{transform:rotate(1.3deg)}100%{transform:rotate(-1.5deg)}}
.p.armL{animation:swayL 3.4s ease-in-out infinite alternate}
.p.armR{animation:swayR 3.8s ease-in-out infinite alternate}
.p.legL{animation:stepL 4.6s ease-in-out infinite alternate}
.p.legR{animation:stepR 4.2s ease-in-out infinite alternate}
/* 말할 때 — 팔을 조금 더 크게 */
@keyframes swayLt{0%{transform:rotate(-6deg)}100%{transform:rotate(7.5deg)}}
@keyframes swayRt{0%{transform:rotate(6deg)}100%{transform:rotate(-7.5deg)}}
#char.talking .p.armL{animation:swayLt 1.05s ease-in-out infinite alternate}
#char.talking .p.armR{animation:swayRt 1.2s ease-in-out infinite alternate}
/* 기쁠 때 — 팔 번쩍 */
@keyframes cheerL{0%{transform:rotate(-13deg)}100%{transform:rotate(-19deg)}}
@keyframes cheerR{0%{transform:rotate(13deg)}100%{transform:rotate(19deg)}}
#char.happy .p.armL{animation:cheerL .5s ease-in-out infinite alternate}
#char.happy .p.armR{animation:cheerR .5s ease-in-out infinite alternate}
/* 생각할 때 — 한쪽 팔만 살짝 */
@keyframes ponder{0%{transform:rotate(-9deg)}100%{transform:rotate(-13deg)}}
#char.thinking .p.armR{animation:ponder .9s ease-in-out infinite alternate}
#char.thinking .p.armL{animation:swayL 3.4s ease-in-out infinite alternate}
.rig .face{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
  filter:none;margin:0}
.eye{transform-box:fill-box;transform-origin:center}
.pupil{transform-box:fill-box;transform-origin:center;transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.mouth,.smile{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .22s}
.blush{opacity:0;transition:opacity .34s;filter:blur(5px)}
.acc{animation:accPop .42s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes accPop{0%{opacity:0;transform:translateY(-6px) scale(.7)}100%{opacity:1;transform:none}}
@keyframes splashHop{0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
#splashAv.bounce img,#splashAv.bounce svg{animation:splashHop .6s ease-in-out}
@keyframes eblink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.07)}}
@keyframes glance{0%,70%,100%{transform:translate(0,0)}
  78%{transform:translate(4px,1px)}88%{transform:translate(-4px,1px)}}
@keyframes mtalk{0%{transform:scaleY(.18) scaleX(.9)}100%{transform:scaleY(1) scaleX(1.04)}}
@keyframes bob{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-5px) rotate(1deg)}}
#char .eye{animation:eblink 4.8s ease-in-out infinite}
#char .pupil{animation:glance 7.2s ease-in-out infinite}
#char.talking .mouth{opacity:1;animation:mtalk .25s ease-in-out infinite alternate}
#char.talking .inner{animation:bob .44s ease-in-out infinite alternate}
#char.thinking .pupil{transform:translate(7px,-9px);animation:none}
#char.thinking .inner{animation:sway .52s ease-in-out infinite alternate}
/* ── 답변 포즈 ── */
@keyframes pointUp{0%{transform:rotate(-40deg)}100%{transform:rotate(-34deg)}}
@keyframes armOut{0%{transform:rotate(13deg)}100%{transform:rotate(17deg)}}
@keyframes armOutL{0%{transform:rotate(-13deg)}100%{transform:rotate(-17deg)}}
@keyframes waveArm{0%{transform:rotate(-24deg)}100%{transform:rotate(-40deg)}}
@keyframes tiltBody{0%{transform:rotate(-2deg)}100%{transform:rotate(2.4deg)}}
/* 길안내 — 한쪽 팔을 들어 가리킵니다 */
#char.pose-point .p.armR{animation:pointUp 1.6s ease-in-out infinite alternate}
#char.pose-point .p.armL{animation:swayL 3.4s ease-in-out infinite alternate}
/* 소개 — 양팔을 살짝 벌립니다 */
#char.pose-present .p.armL{animation:armOutL 2.2s ease-in-out infinite alternate}
#char.pose-present .p.armR{animation:armOut 2.4s ease-in-out infinite alternate}
/* 인사 — 한 팔을 흔듭니다 */
#char.pose-wave .p.armR{animation:waveArm .46s ease-in-out infinite alternate}
#char.pose-wave .p.armL{animation:swayL 3.4s ease-in-out infinite alternate}
/* 자랑 — 양팔을 크게 벌립니다 */
#char.pose-show .p.armL{animation:cheerL 1.5s ease-in-out infinite alternate}
#char.pose-show .p.armR{animation:cheerR 1.6s ease-in-out infinite alternate}
/* 갸웃 — 모를 때 */
#char.pose-shrug .p.armL{animation:armOutL 1.8s ease-in-out infinite alternate}
#char.pose-shrug .p.armR{animation:armOut 1.9s ease-in-out infinite alternate}
#char.pose-shrug .inner{animation:tiltBody 1.8s ease-in-out infinite alternate}

/* ── 터치 반응 ── */
#char{cursor:pointer;-webkit-user-select:none;user-select:none}
/* 간지럼 — 아주 살짝만 (간지러운 "척") */
@keyframes tickle{
  0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-2.2px) rotate(-1deg)}
  50%{transform:translateX(2.2px) rotate(1deg)}
  75%{transform:translateX(-1.4px) rotate(-.6deg)}}
@keyframes laughBounce{
  0%,100%{transform:translateY(0) scale(1,1)}
  25%{transform:translateY(-9px) scale(.98,1.035)}
  55%{transform:translateY(0) scale(1.035,.97)}
  80%{transform:translateY(-4px) scale(.99,1.015)}}
@keyframes pokeSquash{
  0%,100%{transform:scale(1,1)}
  30%{transform:scale(1.045,.945)}
  60%{transform:scale(.98,1.025)}}
@keyframes hopUp{
  0%,100%{transform:translateY(0) scale(1,1)}
  35%{transform:translateY(-11px) scale(.985,1.03)}
  70%{transform:translateY(0) scale(1.025,.98)}}
@keyframes armWiggle{0%{transform:rotate(-7deg)}100%{transform:rotate(-2deg)}}
@keyframes armWiggleR{0%{transform:rotate(7deg)}100%{transform:rotate(2deg)}}
@keyframes armUpL{0%{transform:rotate(-9deg)}100%{transform:rotate(-15deg)}}
@keyframes armUpR{0%{transform:rotate(9deg)}100%{transform:rotate(15deg)}}

/* 웃음 — 살짝 들썩이며 웃습니다 */
#char.rx-tickle .inner{animation:tickle .62s ease-in-out infinite}
#char.rx-tickle .eye{transform:scaleY(.42);animation:none}
#char.rx-tickle .blush{opacity:.36}
#char.rx-tickle .mouth{opacity:.9;animation:mtalk .3s ease-in-out infinite alternate}
#char.rx-tickle .p.armL{animation:armWiggle .34s ease-in-out infinite alternate}
#char.rx-tickle .p.armR{animation:armWiggleR .38s ease-in-out infinite alternate}

/* 크게 웃기 */
#char.rx-laugh .inner{animation:laughBounce .52s ease-in-out infinite}
#char.rx-laugh .eye{transform:scaleY(.22);animation:none}
#char.rx-laugh .blush{opacity:.44}
#char.rx-laugh .mouth{opacity:1;animation:mtalk .19s ease-in-out infinite alternate}
#char.rx-laugh .p.armL{animation:cheerL .34s ease-in-out infinite alternate}
#char.rx-laugh .p.armR{animation:cheerR .34s ease-in-out infinite alternate}

/* 삐짐 — 코를 만지면 홱 돌아섭니다 */
@keyframes pout{
  0%{transform:rotate(0) translateX(0)}
  35%{transform:rotate(-5deg) translateX(-7px)}
  100%{transform:rotate(-3.5deg) translateX(-5px)}}
@keyframes armPout{0%{transform:rotate(9deg)}100%{transform:rotate(15deg)}}
@keyframes armPoutL{0%{transform:rotate(-9deg)}100%{transform:rotate(-15deg)}}
#char.rx-pout .inner{animation:pout .5s ease-out forwards}
#char.rx-pout .eye{transform:scaleY(.6);animation:none}
#char.rx-pout .pupil{transform:translate(-9px,2px);animation:none}
#char.rx-pout .blush{opacity:.3}
#char.rx-pout .p.armL{animation:armPoutL .5s ease-out forwards}
#char.rx-pout .p.armR{animation:armPout .5s ease-out forwards}

/* 주목 — 부르면 쳐다봅니다 */
@keyframes nod{0%,100%{transform:translateY(0)}45%{transform:translateY(5px)}}
#char.rx-notice .inner{animation:nod .42s ease-in-out 1}
#char.rx-notice .eye{transform:scale(1.12);animation:none}
#char.rx-notice .blush{opacity:.22}

/* 반가움 — 손 흔들기 */
#char.rx-wave .p.armR{animation:waveArm .34s ease-in-out infinite alternate}
#char.rx-wave .eye{transform:scaleY(.5);animation:none}
#char.rx-wave .blush{opacity:.34}
#char.rx-wave .smile{opacity:1}

/* 폴짝 — 신남 */
#char.rx-hop .inner{animation:hopUp .5s ease-in-out infinite}
#char.rx-hop .eye{transform:scaleY(.55);animation:none}
#char.rx-hop .blush{opacity:.3}
#char.rx-hop .smile{opacity:1}
#char.rx-hop .p.armL{animation:armUpL .25s ease-in-out infinite alternate}
#char.rx-hop .p.armR{animation:armUpR .25s ease-in-out infinite alternate}

/* 쓰담쓰담 — 길게 누르면 */
@keyframes purr{0%,100%{transform:rotate(0) scale(1)}
  25%{transform:rotate(-2deg) scale(1.015)}75%{transform:rotate(2deg) scale(1.015)}}
#char.rx-purr .inner{animation:purr .9s ease-in-out infinite}
#char.rx-purr .eye{transform:scaleY(.28);animation:none}
#char.rx-purr .blush{opacity:.48}
#char.rx-purr .smile{opacity:1}

/* 유휴 — 아무 말 없을 때 두리번 */
@keyframes lookAround{0%,100%{transform:translate(0,0)}
  20%{transform:translate(7px,-2px)}45%{transform:translate(-7px,-2px)}70%{transform:translate(0,3px)}}
#char.rx-idle .pupil{animation:lookAround 2.6s ease-in-out;animation-iteration-count:1}
@keyframes yawn{0%,100%{transform:scaleY(1)}35%{transform:scaleY(.35)}65%{transform:scaleY(.35)}}
#char.rx-yawn .eye{animation:yawn 1.4s ease-in-out}
#char.rx-yawn .mouth{opacity:1;transform:scaleY(1.8) scaleX(.8)}
@keyframes stretch{0%,100%{transform:scaleY(1)}40%{transform:scaleY(1.05) translateY(-5px)}}
#char.rx-yawn .inner{animation:stretch 1.4s ease-in-out}

/* 졸림 — 영업 종료 시간 */
#char.sleepy .eye{transform:scaleY(.45)}
#char.sleepy .inner{animation:breathe 5.2s ease-in-out infinite}

/* 어지러움 — 너무 많이 만졌을 때 */
@keyframes dizzy{0%{transform:rotate(-7deg)}100%{transform:rotate(7deg)}}
#char.rx-dizzy .inner{animation:dizzy .28s ease-in-out infinite alternate}
#char.rx-dizzy .eye{transform:scaleY(.2);animation:none}
#char.rx-dizzy .blush{opacity:.5}
#char.rx-dizzy .mouth{opacity:1}

/* ══════════════════════════════════════════════════════════════
   새 반응 6종 — 팔 조각 없이도(몸통 사진 한 장 + 눈·입만으로) 깨지지 않게
   ══════════════════════════════════════════════════════════════ */
.heart-eye{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .18s}

/* 하트눈 — 완전 좋아할 때 */
@keyframes heartBounce{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.1) translateY(-4px)}}
#char.rx-heart .inner{animation:heartBounce .5s ease-in-out 2}
#char.rx-heart .eye{opacity:0}
#char.rx-heart .heart-eye{opacity:1}
#char.rx-heart .blush{opacity:.4}
#char.rx-heart .smile{opacity:1}

/* 윙크 — 능청스럽게 한쪽 눈만 */
@keyframes winkTilt{0%,100%{transform:rotate(0)}40%{transform:rotate(-6deg)}}
#char.rx-wink .inner{animation:winkTilt .5s ease-in-out 1}
#char.rx-wink .eye-R{transform:scaleY(.08)}
#char.rx-wink .eye-L{transform:scale(1.08)}
#char.rx-wink .smile{opacity:1}
#char.rx-wink .blush{opacity:.3}

/* 부끄러움 — 시선을 살짝 피합니다 */
@keyframes shySway{0%{transform:translateX(-2px) rotate(-1deg)}100%{transform:translateX(2px) rotate(1deg)}}
#char.rx-shy .inner{animation:shySway .8s ease-in-out infinite alternate}
#char.rx-shy .eye{transform:scaleY(.7)}
#char.rx-shy .pupil{transform:translate(0,3px);animation:none}
#char.rx-shy .blush{opacity:.55}

/* 깜짝 놀람 */
@keyframes surprisedPop{0%,100%{transform:scale(1) translateY(0)}40%{transform:scale(1.1) translateY(-7px)}}
#char.rx-surprised .inner{animation:surprisedPop .45s cubic-bezier(.3,1.4,.4,1) 1}
#char.rx-surprised .eye{transform:scale(1.3);animation:none}
#char.rx-surprised .mouth{opacity:1;transform:scale(1,1.7)}

/* 궁금 — 갸웃하며 한쪽을 바라봅니다 */
@keyframes curiousTilt{0%{transform:rotate(0)}60%,100%{transform:rotate(8deg)}}
#char.rx-curious .inner{animation:curiousTilt .9s ease-in-out 1 both}
#char.rx-curious .pupil{transform:translate(3px,-3px);animation:none}

/* 까르르 — 옆으로 통통 웃음 */
@keyframes giggleShimmy{0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
#char.rx-giggle .inner{animation:giggleShimmy .45s ease-in-out 3}
#char.rx-giggle .eye{transform:scaleY(.25);animation:none}
#char.rx-giggle .smile{opacity:1}
#char.rx-giggle .blush{opacity:.34}

/* 팔 조각이 없어도(rigged:false) 인사·안내 포즈일 때 몸통이라도 조금 움직이게 */
@keyframes waveBody{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pointBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes presentBody{0%,100%{transform:rotate(-1.5deg)}100%{transform:rotate(1.5deg)}}
@keyframes showBody{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#char.rx-wave .inner{animation:waveBody .34s ease-in-out infinite alternate}
#char.pose-wave .inner{animation:waveBody .46s ease-in-out infinite alternate}
#char.pose-point .inner{animation:pointBody 1.6s ease-in-out infinite alternate}
#char.pose-present .inner{animation:presentBody 2.2s ease-in-out infinite alternate}
#char.pose-show .inner{animation:showBody 1.5s ease-in-out infinite alternate}

/* 반짝임 */
.spark{position:absolute;pointer-events:none;font-size:17px;line-height:1;
  animation:sparkUp .85s ease-out forwards;z-index:5}
@keyframes sparkUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  25%{opacity:1;transform:translate(-50%,-95%) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.85)}}

#char.happy .blush{opacity:.34}
#char.happy .smile{opacity:1}
#char.talking .blush{opacity:.2}
#char.happy.talking .smile{opacity:0}
#char img.framed{border-radius:50%;height:100%;width:auto;aspect-ratio:1/1;object-fit:cover;
  border:5px solid var(--white);box-shadow:0 8px 22px rgba(20,30,45,.14);
  filter:none}
/* 인형 뒤에 깔던 빛번짐 원은 없앴습니다.
   블러가 걸린 큰 원이 뒤에 남아 잔상처럼 보였습니다.
   색은 모서리 파스텔 원이 대신합니다. */
#shadow{position:absolute;left:50%;bottom:-2px;width:38%;height:11px;border-radius:50%;
  transform:translateX(-50%);background:rgba(40,40,80,.16);filter:blur(5px);
  transition:width .42s,opacity .42s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.012)}}
@keyframes sway{0%{transform:rotate(-3.4deg)}100%{transform:rotate(3.4deg)}}
/* 가만히 있을 때 끝없이 도는 애니메이션은 없앴습니다.
   여러 장을 겹친 레이어 위에서 무한 반복 transform 이 돌면
   일부 브라우저에서 이전 프레임 자국이 다 지워지지 않고 남습니다. */
#char.thinking .inner{animation:sway .52s ease-in-out infinite alternate}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
#char .eyes{animation:blink 5.4s ease-in-out infinite;transform-origin:50% 126px}
#app.sheet #char{max-height:clamp(130px,22vh,180px)}
#app.sheet #speech{font-size:15.4px;max-height:20vh}
#app.sheet #shadow{width:30%;opacity:.6}

/* ══════════════════════════════════════════════════════════════
   덧붙인 반응들 — 가끔만 나옵니다
   ══════════════════════════════════════════════════════════════ */
/* 졸다가 깜짝 놀라 깨기 */
@keyframes rxWake{0%{transform:translateY(3px) rotate(1.5deg) scale(.99)}
  22%{transform:translateY(-14px) rotate(-2deg) scale(1.05)}
  40%{transform:translateY(2px) rotate(2deg) scale(.98)}
  58%{transform:translateY(-6px) rotate(-1deg) scale(1.02)}
  100%{transform:none}}
#char.rx-wake .inner{animation:rxWake 1.2s cubic-bezier(.3,1.3,.4,1) both}
#char.rx-wake .eyes{transform:scaleY(1.25)}

/* 재채기 — 움츠렸다 터뜨립니다 */
@keyframes rxSneeze{0%{transform:none}
  30%{transform:translateY(-7px) scale(.94,1.05)}
  42%{transform:translateY(-9px) scale(.92,1.07)}
  52%{transform:translateY(9px) scale(1.09,.9) rotate(-3deg)}
  70%{transform:translateY(-2px) scale(1.01,.99)}
  100%{transform:none}}
#char.rx-sneeze .inner{animation:rxSneeze 1s cubic-bezier(.3,1.2,.4,1) both}

/* 딸꾹질 — 짧게 두 번 튑니다 */
@keyframes rxHic{0%,100%{transform:none}
  12%{transform:translateY(-11px) scale(1.03,.97)} 26%{transform:none}
  52%{transform:translateY(-8px) scale(1.02,.98)} 66%{transform:none}}
#char.rx-hic .inner{animation:rxHic 1.5s ease-out both}

/* 기지개 — 위로 쭉 */
@keyframes rxStretch{0%,100%{transform:none}
  35%,60%{transform:translateY(-9px) scaleY(1.07) scaleX(.96)}}
#char.rx-stretch .inner{animation:rxStretch 2.1s cubic-bezier(.4,0,.3,1) both}
#char.rx-stretch .armL{animation:none;transform:rotate(-34deg)}
#char.rx-stretch .armR{animation:none;transform:rotate(34deg)}

/* 빙글 한 바퀴 */
@keyframes rxSpin{0%{transform:rotateY(0) translateY(0)}
  50%{transform:rotateY(180deg) translateY(-12px)}
  100%{transform:rotateY(360deg) translateY(0)}}
#char.rx-spin .inner{animation:rxSpin 1.1s cubic-bezier(.4,0,.3,1) both}

/* 폴짝폴짝 두 번 */
@keyframes rxHop2{0%,100%{transform:none}
  15%{transform:translateY(-22px) scaleY(1.05)} 32%{transform:translateY(0) scaleY(.94)}
  50%{transform:translateY(-18px) scaleY(1.04)} 68%{transform:translateY(0) scaleY(.95)}
  82%{transform:translateY(-4px)}}
#char.rx-hop2 .inner{animation:rxHop2 1.4s cubic-bezier(.3,1.1,.4,1) both}

/* 손 흔들며 배웅 */
@keyframes rxByeArm{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-58deg)}}
#char.rx-bye .armR{animation:rxByeArm .42s ease-in-out 4 both}
#char.rx-bye .inner{animation:float 3.2s ease-in-out infinite}

/* ══════════════════════════════════════════════
   질문 네비게이터 — 입력창을 대신하는 화면 아래 영역
   ══════════════════════════════════════════════ */
#nav{position:relative;z-index:6;flex:0 0 auto;
  background:var(--white);border-top:none;
  border-radius:26px 26px 0 0;
  box-shadow:0 -4px 24px rgba(40,40,80,.07);
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:52%;display:flex;flex-direction:column;min-height:0;
  transition:max-height .38s cubic-bezier(.2,.9,.3,1.05)}

#navTop{flex:0 0 auto;display:flex;align-items:center;gap:9px;
  min-height:24px;margin-bottom:11px}
#navTop .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.03em}
#navTop .sp{margin-left:auto}
.back{display:flex;align-items:center;gap:5px;font-size:12.6px;font-weight:600;
  color:var(--grey);padding:5px 12px 5px 8px;border-radius:var(--r-pill);background:var(--light)}
.back:active{transform:scale(.94)}
#navBody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}
#navBody::-webkit-scrollbar{width:0}

/* 묶음 고르기 */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cat{display:flex;align-items:center;gap:10px;text-align:left;
  border:none;border-radius:var(--r-row);padding:14px 13px;
  background:var(--white);box-shadow:var(--sh1);
  transition:transform .14s,box-shadow .18s}
.cat:active{transform:scale(.965)}
.cat i{flex:0 0 9px;width:9px;height:9px;border-radius:50%;display:block}
.cat .cn{font-size:13.2px;font-weight:700;line-height:1.35;letter-spacing:-.03em}
.cat.wide{grid-column:1/-1;justify-content:center;
  border-style:dashed;border-color:var(--pink);color:var(--pink)}
.cat.wide .cn{font-weight:700}

/* 질문 목록 */
.qs{display:grid;gap:8px}
.q{display:flex;align-items:center;gap:11px;text-align:left;width:100%;
  border:none;border-radius:var(--r-row);padding:14px 14px;
  background:var(--white);box-shadow:var(--sh1);
  font-size:14px;font-weight:600;line-height:1.45;letter-spacing:-.03em;
  transition:transform .14s,box-shadow .18s}
.q:active{transform:scale(.975)}
.q .qi{flex:0 0 6px;width:6px;height:6px;border-radius:50%;display:block;opacity:.55}
.q .qt{flex:1 1 auto;min-width:0}
.q .qa{flex:0 0 auto;color:var(--sep);font-size:15px;font-weight:400}

/* 답변 뒤 이어보기 */
.follow{display:flex;flex-wrap:wrap;gap:7px}
.fchip{border:none;color:var(--pink);background:var(--pinksoft);
  border-radius:var(--r-pill);padding:10px 16px;font-size:13px;font-weight:700;
  letter-spacing:-.03em;line-height:1.3;text-align:left;transition:transform .14s}
.fchip:active{transform:scale(.94)}
.fchip.t{background:var(--tealsoft);color:#2AA694}
.fchip.p{background:#F0EBFC;color:#8B6BD6}
.fchip.y{background:#FDF3D9;color:#B98B12}
.fchip.plain{background:var(--light);color:var(--ink2)}

/* 못 찾았을 때 */
.miss{display:block;width:100%;text-align:center;margin-top:11px;padding:9px;
  font-size:12px;color:var(--grey);text-decoration:underline;text-underline-offset:3px}

/* ══════════════════════════════════════════════
   커스텀 만들러 가기 — 다른 묶음과 같은 크기
   ══════════════════════════════════════════════ */
.cat.go-custom{background:var(--pink)}
.cat.go-custom .cn{color:#fff;font-weight:800}
.cat.go-custom i{background:#fff !important;opacity:.9}

/* 답변 뒤에 붙는 큰 안내 (커스텀 관련 질문에만) */
.cta{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--pink);color:#fff;border-radius:var(--r-row);padding:14px 15px;
  margin-bottom:9px;flex-wrap:wrap;
  box-shadow:0 3px 8px rgba(245,101,152,.26);transition:transform .14s}
.cta:active{transform:scale(.975)}
.cta .ct{flex:1 1 auto;font-size:13.6px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.cta .ar{flex:0 0 auto;font-size:15px;font-weight:700;opacity:.9}
.cta .cs{flex:1 1 100%;font-size:11.2px;opacity:.86;line-height:1.4}

/* ══════════════════════════════════════════════
   카드 열기 버튼
   카드가 저절로 올라오면 성가시므로, 눌렀을 때만 엽니다.
   ══════════════════════════════════════════════ */
.cardbtns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.cardbtn{display:inline-flex;align-items:center;gap:6px;
  border:none;border-radius:var(--r-pill);padding:10px 15px;
  background:var(--white);box-shadow:var(--sh1);
  font-size:12.8px;font-weight:700;color:var(--ink2);letter-spacing:-.03em;
  line-height:1.3;transition:transform .14s}
.cardbtn:active{transform:scale(.95)}
.cardbtn .ci{font-size:10px;color:var(--pink);line-height:1}
/* ══ 카드 — 아래에서 올라오는 시트 ══ */
#dim{position:absolute;top:0;right:0;bottom:0;left:0;z-index:9;background:rgba(20,20,20,.18);
  opacity:0;visibility:hidden;transition:.32s}
#app.sheet #dim{opacity:1;visibility:visible}
#sheetC{position:absolute;left:0;right:0;bottom:0;z-index:10;
  background:var(--white);border-radius:28px 28px 0 0;
  box-shadow:0 -6px 34px rgba(40,40,80,.14);
  transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.3,1.05);
  max-height:64%;display:flex;flex-direction:column;
  padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#app.sheet #sheetC{transform:none}
#grab{flex:0 0 auto;padding:10px 0 4px;display:flex;justify-content:center}
#grab i{width:40px;height:4px;border-radius:2px;background:var(--line);display:block}
#sheetIn{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px}
#sheetIn::-webkit-scrollbar{width:0}
#sheetClose{flex:0 0 auto;margin:0 16px 6px;padding:13px;border-radius:var(--r-row);
  background:var(--light);font-size:13.4px;font-weight:700;color:var(--ink2);
  text-align:center;letter-spacing:-.02em}

/* 카드 */
.card{background:var(--white);border:none;box-shadow:var(--sh1);
  border-radius:var(--r-card);padding:16px;width:100%}
.card h4{font-size:14.5px;font-weight:800;letter-spacing:-.03em;
  margin-bottom:11px;display:flex;align-items:center;gap:6px}
.card h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:0 0 auto;margin-right:6px}
.ptab{display:flex;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ptab div{flex:1 1 0;min-width:0;background:var(--white);padding:8px 3px;text-align:center}
.ptab small{display:block;font-size:10.4px;color:var(--grey);margin-bottom:2px}
.ptab b{font-size:12.6px;color:var(--pink);font-weight:600}
.ptab div.hi{background:var(--pinksoft)}
.steps{display:grid;gap:9px}
.stp{display:flex;gap:10px;align-items:flex-start}
.stp .no{flex:0 0 21px;width:21px;height:21px;border-radius:50%;color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.stp .tx{font-size:13.4px;line-height:1.55}
.stp .tx small{display:block;color:var(--grey);font-size:11.6px}
.mapc svg{width:100%;height:auto;display:block;border-radius:9px;background:#F7F6F2}
.mapleg{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11.6px;color:var(--ink2)}
.mapleg span{display:flex;align-items:center;gap:5px;margin-right:10px}
.mapleg i{width:9px;height:9px;border-radius:50%;display:block;margin-right:4px}
.stores{display:grid;gap:9px}
.store{border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.store .t{font-size:13.4px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.store .t i{width:8px;height:8px;border-radius:50%;display:block;flex:0 0 auto;margin-right:5px}
.store .a{font-size:12px;color:var(--ink2);line-height:1.5}
.store .m{font-size:11.4px;color:var(--grey);margin-top:3px}
.store .badge{display:inline-block;font-size:10.4px;font-weight:700;color:#fff;
  background:var(--teal);border-radius:999px;padding:2px 8px;margin-top:6px}
.store .lnks{display:flex;flex-wrap:wrap;gap:14px;margin-top:7px}
.store .lnk{display:inline-flex;align-items:center;gap:4px;font-size:11.8px;font-weight:600;
  color:var(--purple);margin-top:0;text-decoration:none}
.styGrid{display:flex;flex-wrap:wrap;gap:7px;display:grid;grid-template-columns:1fr 1fr}
.sty{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--white);
  flex:1 1 calc(50% - 4px);transition:transform .14s,border-color .2s}
.sty:active{transform:scale(.96);border-color:var(--pink)}
.sty i{width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:block;margin-right:6px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sty .stx{flex:1 1 auto;min-width:0;display:block}
.sty .sn{font-size:12.2px;font-weight:600;display:block;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sty .sd{font-size:10.4px;color:var(--grey);display:block;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frGrid{display:flex;flex-wrap:wrap;gap:8px;display:grid;grid-template-columns:repeat(4,1fr)}
.fr{width:100%;height:auto;border-radius:50%;display:block;background:var(--light);
  flex:0 0 calc(25% - 6px);max-width:calc(25% - 6px)}
@supports (display:grid){ .fr{max-width:100%} }
.prods{display:grid;gap:9px}
.prod{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.prod .ic{flex:0 0 46px;width:46px;height:46px;border-radius:11px;background:var(--light);
  display:flex;align-items:center;justify-content:center;margin-right:4px}
.prod .n{font-size:13.4px;font-weight:700}
.prod .d{font-size:11.8px;color:var(--grey);line-height:1.5}
.prod .p{font-size:12px;font-weight:600;color:var(--pink);margin-top:2px}
.kv{display:grid;gap:7px}
.kv div{display:flex;gap:9px;font-size:13px;line-height:1.55}
.kv .k{flex:0 0 74px;color:var(--grey);font-size:12.2px;margin-right:8px}
.kv .v{color:var(--ink2)}
.kv .v b{color:var(--ink)}
.tip{background:var(--pinksoft);border-radius:9px;padding:9px 11px;font-size:12.4px;
  color:var(--ink2);margin-top:9px;line-height:1.6}
.tip.t{background:var(--tealsoft)}

/* ── 첫 화면 ── */
/* ══════════════════════════════════════════════════════════════
   첫 화면 — 파스텔 원이 겹친 위에 인형이 뜹니다
   ══════════════════════════════════════════════════════════════ */
#splash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 26px 30px;text-align:center;transition:opacity .55s ease,visibility .55s}
#splash.gone{opacity:0;visibility:hidden}
#splash .mark{font-weight:800;font-style:italic;font-size:19px;letter-spacing:-.03em;
  color:var(--ink);position:relative;z-index:3;
  background:var(--white);border-radius:var(--r-pill);padding:8px 18px;
  box-shadow:var(--sh1);margin-bottom:6px}

/* 인형 뒤에 겹쳐 깔리는 파스텔 원들 */
#splashAv{position:relative;z-index:2;margin:4px 0 2px;
  cursor:pointer;-webkit-user-select:none;user-select:none}
#splashAv::before{content:'';position:absolute;left:50%;top:50%;
  width:min(66vw,250px);aspect-ratio:1/1;transform:translate(-50%,-50%);
  border-radius:50%;z-index:-1;opacity:.5;
  background:
    radial-gradient(circle at 50% 8%,  var(--teal)   0 30%, transparent 31%),
    radial-gradient(circle at 50% 26%, var(--blue)   0 30%, transparent 31%),
    radial-gradient(circle at 50% 46%, var(--purple) 0 30%, transparent 31%),
    radial-gradient(circle at 50% 66%, var(--pink)   0 30%, transparent 31%),
    radial-gradient(circle at 50% 86%, var(--yellow) 0 30%, transparent 31%);
  filter:blur(7px)}
#splashAv img,#splashAv svg{position:relative;z-index:2;
  height:min(34vh,240px);width:auto;
  filter:drop-shadow(0 12px 20px rgba(40,40,80,.16))}
#splashAv img.framed{border-radius:50%;aspect-ratio:1/1;object-fit:cover;
  border:5px solid #fff;box-shadow:var(--sh1);filter:none}

#splash .hey{font-size:22px;font-weight:800;letter-spacing:-.035em;
  margin:14px 0 8px;position:relative;z-index:2}
#splash .sub{font-size:13.4px;color:var(--grey);line-height:1.85;font-weight:500;
  margin-bottom:26px;position:relative;z-index:2}
#splash .pickL{font-size:12.6px;color:var(--grey);font-weight:500;
  margin-bottom:12px;position:relative;z-index:2}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:11px;
  width:100%;max-width:330px;position:relative;z-index:2}
.langs>.lb{flex:1 1 calc(50% - 5px)}
.langs>.lb.wide{flex:1 1 100%}
.lb{height:60px;border-radius:var(--r-pill);display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:15.5px;
  letter-spacing:-.02em;box-shadow:var(--sh1);
  transition:transform .16s ease,box-shadow .16s}
.lb:active{transform:scale(.955);box-shadow:var(--sh1)}
.lb.wide{grid-column:1/-1}
#lsheet{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(20,20,20,.34);
  display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:.25s}
#lsheet.on{opacity:1;visibility:visible}
#lsheet .in{width:100%;background:var(--white);border-radius:26px 26px 0 0;padding:22px 18px 28px;
  transform:translateY(14px);transition:.25s}
#lsheet.on .in{transform:none}
#lsheet h5{font-size:14.5px;font-weight:700;margin-bottom:13px}
#lsheet .langs{max-width:none}
@media (prefers-reduced-motion: reduce){ #char .inner,#char .eyes,#splashAv img{animation:none} }

/* ── 파트너 매장 ── */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitem{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--white)}
.pitem .pa{display:block;font-size:10.8px;font-weight:600;color:var(--grey);
  letter-spacing:-.01em;margin-bottom:3px}
.pitem .pn{display:block;font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.35}

/* ══════════════════════════════════════════════════════════════
   어두운 유리 모드 (ui=overlay)

   화면을 다 덮지 않습니다. 여느 챗봇처럼 오른쪽 아래에 뜨되,
   흰 판 대신 어두운 유리로 만들고 뒤 페이지를 흐리게 깝니다.
   패널 크기는 감싸는 쪽(런처 iframe)이 정합니다.
   ══════════════════════════════════════════════════════════════ */
body.ui-overlay{background:transparent;overflow:hidden}
body.ui-overlay #app{max-width:none;width:100%;height:100%;
  background:rgba(26,24,34,.82);
  -webkit-backdrop-filter:blur(24px) saturate(.7) brightness(.7);
  backdrop-filter:blur(24px) saturate(.7) brightness(.7);
  border-radius:0;box-shadow:none}
@media(min-width:520px){
  body.ui-overlay #app{height:100%;border-radius:0;box-shadow:none}
}

/* 글씨는 흰색으로 */
body.ui-overlay #speech{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
body.ui-overlay #speech .sub{color:rgba(255,255,255,.72)}
body.ui-overlay #speech em{color:#FFA9C6}
body.ui-overlay #speech b{color:#fff;font-weight:700}

/* 떠 있는 컨트롤 */
body.ui-overlay #ctl .mark{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.ui-overlay #ctl .status{background:rgba(47,167,159,.3);color:#9FE8E1}
body.ui-overlay #ctl .status.off{background:rgba(255,255,255,.13);color:rgba(255,255,255,.6)}
body.ui-overlay .gbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.24);
  color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* 인형 — 빛번짐과 바닥 그림자를 끕니다.
   어두운 바탕에서는 뒤에 인형이 하나 더 있는 것처럼 보입니다. */
body.ui-overlay #shadow{display:none}
/* 어두운 바탕에서는 짙은 그림자가 얼룩처럼 남습니다 */
body.ui-overlay #char img.base{}
body.ui-overlay .blob{opacity:.1}

/* 질문 영역 — 흰 판을 걷어내고 알약만 띄웁니다 */
body.ui-overlay #nav{background:transparent;box-shadow:none;border-radius:0;
  border-top:1px solid rgba(255,255,255,.09)}
body.ui-overlay #navTop .ttl{color:#fff}
body.ui-overlay .back{background:rgba(255,255,255,.15);color:rgba(255,255,255,.86)}

body.ui-overlay .cat,
body.ui-overlay .q,
body.ui-overlay .fchip,
body.ui-overlay .cardbtn{background:rgba(255,255,255,.95);border-color:transparent;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
body.ui-overlay .cat.go-custom{background:var(--pink)}
body.ui-overlay .cat.go-custom .cn{color:#fff}
body.ui-overlay .fchip{background:rgba(255,255,255,.95)}
body.ui-overlay .fchip.t{color:#2AA694} body.ui-overlay .fchip.p{color:#8B6BD6}
body.ui-overlay .fchip.y{color:#B98B12}
body.ui-overlay .fchip{border-width:0;font-weight:600}
body.ui-overlay .fchip.plain{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
body.ui-overlay .cardbtn{color:var(--ink2);font-weight:600}
body.ui-overlay .miss{color:rgba(255,255,255,.58)}

/* 첫 화면 */
body.ui-overlay #splash{background:rgba(26,24,34,.55)}
body.ui-overlay #splash .pickL{color:rgba(255,255,255,.66)}
body.ui-overlay #splash .mark,
body.ui-overlay #splash .hey{color:#fff}
body.ui-overlay #splash .sub{color:rgba(255,255,255,.66)}

/* 카드 시트 */
body.ui-overlay #dim{background:rgba(0,0,0,.42)}

@media (prefers-reduced-motion: reduce){
  #char .inner,#char .eyes,#splashAv img,.p{animation:none !important}
  #nav,#sheetC,#speech{transition:none}
}
</style>

/* ── 소품 SVG (얼굴 좌표 기준) ── */
function accSVG(items, col){
  const V=CHAR.view, L=CHAR.eyeL, R=CHAR.eyeR, M=CHAR.mouth;
  const cx=(L.x+R.x)/2, ey=(L.y+R.y)/2, r=(L.r+R.r)/2;
  const W=V.w, H=V.h;
  /* 인체 기준선 — 사진 크기 대비 비율 */
  const hatBrim = H*0.185, hatPeak = H*0.062, hatW = W*0.30;
  const crBase  = H*0.160, crTop   = H*0.072, crW  = W*0.21;
  const neckY   = H*0.472, scW = W*0.27;
  const earY    = H*0.150, headW = W*0.62;
  const c = col || '#F56598';
  let out='';

  if(items.glasses){
    out+=`<g class="acc" opacity=".96">
      <circle cx="${L.x}" cy="${L.y}" r="${r*1.7}" fill="#fff" opacity=".16"/>
      <circle cx="${R.x}" cy="${R.y}" r="${r*1.7}" fill="#fff" opacity=".16"/>
      <circle cx="${L.x}" cy="${L.y}" r="${r*1.7}" fill="none" stroke="${c}" stroke-width="${r*.3}"/>
      <circle cx="${R.x}" cy="${R.y}" r="${r*1.7}" fill="none" stroke="${c}" stroke-width="${r*.3}"/>
      <path d="M ${L.x+r*1.7} ${ey} L ${R.x-r*1.7} ${ey}" stroke="${c}" stroke-width="${r*.26}" fill="none"/>
      <path d="M ${L.x-r*1.7} ${ey} L ${L.x-r*3.4} ${ey-r*.5}" stroke="${c}" stroke-width="${r*.22}" stroke-linecap="round"/>
      <path d="M ${R.x+r*1.7} ${ey} L ${R.x+r*3.4} ${ey-r*.5}" stroke="${c}" stroke-width="${r*.22}" stroke-linecap="round"/>
    </g>`;
  }
  if(items.sunglass){
    const w=r*1.95, h=r*1.6;
    out+=`<g class="acc">
      <rect x="${L.x-w*1.15}" y="${ey-h*1.25}" width="${(R.x-L.x)+w*2.3}" height="${h*.34}" rx="${h*.17}" fill="#1B1B22"/>
      <ellipse cx="${L.x}" cy="${ey+r*.1}" rx="${w}" ry="${h}" fill="#1B1B22"/>
      <ellipse cx="${R.x}" cy="${ey+r*.1}" rx="${w}" ry="${h}" fill="#1B1B22"/>
      <path d="M ${L.x+w} ${ey} L ${R.x-w} ${ey}" stroke="#1B1B22" stroke-width="${r*.35}"/>
      <ellipse cx="${L.x-r*.55}" cy="${ey-r*.5}" rx="${r*.55}" ry="${r*.32}" fill="#fff" opacity=".32"/>
      <ellipse cx="${R.x-r*.55}" cy="${ey-r*.5}" rx="${r*.55}" ry="${r*.32}" fill="#fff" opacity=".32"/>
    </g>`;
  }
  if(items.hat){
    out+=`<g class="acc">
      <path d="M ${cx-hatW} ${hatBrim} Q ${cx} ${hatPeak-H*0.02} ${cx+hatW} ${hatBrim} Z" fill="${c}"/>
      <rect x="${cx-hatW*1.06}" y="${hatBrim-H*0.018}" width="${hatW*2.12}" height="${H*0.036}" rx="${H*0.018}" fill="${c}" opacity=".9"/>
      <circle cx="${cx}" cy="${hatPeak-H*0.005}" r="${W*0.038}" fill="${c}" opacity=".95"/>
    </g>`;
  }
  if(items.crown){
    const w=crW;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${crBase} L ${cx-w} ${crTop+H*0.030} L ${cx-w*0.5} ${crBase-H*0.030}
               L ${cx} ${crTop} L ${cx+w*0.5} ${crBase-H*0.030} L ${cx+w} ${crTop+H*0.030} L ${cx+w} ${crBase} Z"
            fill="#FEC93D" stroke="#D9A417" stroke-width="${W*0.006}"/>
      <circle cx="${cx}" cy="${crTop}" r="${W*0.018}" fill="#F56598"/>
      <circle cx="${cx-w*0.62}" cy="${crBase-H*0.010}" r="${W*0.013}" fill="#F56598"/>
      <circle cx="${cx+w*0.62}" cy="${crBase-H*0.010}" r="${W*0.013}" fill="#F56598"/>
    </g>`;
  }
  if(items.scarf){
    const y=neckY, w=scW, th=H*0.032;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${y} Q ${cx} ${y+th*1.7} ${cx+w} ${y}
               L ${cx+w} ${y+th} Q ${cx} ${y+th*2.8} ${cx-w} ${y+th} Z" fill="${c}"/>
      <path d="M ${cx-w*0.26} ${y+th*2.2} h ${w*0.52} l -${w*0.06} ${H*0.115} h -${w*0.40} Z" fill="${c}" opacity=".94"/>
    </g>`;
  }
  if(items.ribbon){
    const y=neckY-H*0.030, w=W*0.115, hh=H*0.034;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${y-hh} L ${cx-w*0.22} ${y} L ${cx-w} ${y+hh} Z" fill="${c}"/>
      <path d="M ${cx+w} ${y-hh} L ${cx+w*0.22} ${y} L ${cx+w} ${y+hh} Z" fill="${c}"/>
      <ellipse cx="${cx}" cy="${y}" rx="${w*0.26}" ry="${hh*0.66}" fill="${c}"/><ellipse cx="${cx}" cy="${y}" rx="${w*0.12}" ry="${hh*0.3}" fill="#fff" opacity=".25"/>
    </g>`;
  }
  if(items.flower){
    const fx=cx+headW*0.42, fy=earY+H*0.035, pr=W*0.028;
    let pet='';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      const px=(fx+Math.cos(a)*pr*1.05).toFixed(1), py=(fy+Math.sin(a)*pr*1.05).toFixed(1);
      pet+=`<ellipse cx="${px}" cy="${py}" rx="${pr*0.72}" ry="${pr*0.5}" transform="rotate(${(i*60).toFixed(0)} ${px} ${py})" fill="#fff"/>`; }
    out+=`<g class="acc">${pet}<circle cx="${fx}" cy="${fy}" r="${pr*0.62}" fill="#FEC93D"/></g>`;
  }
  if(items.star){
    const sx=cx-headW*0.44, sy=earY+H*0.02, R1=W*0.042;
    let pts=[];
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?R1*.44:R1;
      pts.push((sx+rr*Math.cos(a)).toFixed(1)+','+(sy+rr*Math.sin(a)).toFixed(1)); }
    out+=`<g class="acc"><polygon points="${pts.join(' ')}" fill="${c}" stroke="#fff" stroke-width="${W*0.004}"/></g>`;
  }
  if(items.heart){
    const hx=cx+headW*0.44, hy=earY+H*0.02, hr=W*0.04;
    out+=`<g class="acc">
      <circle cx="${hx-hr*.44}" cy="${hy-hr*.3}" r="${hr*.52}" fill="${c}"/>
      <circle cx="${hx+hr*.44}" cy="${hy-hr*.3}" r="${hr*.52}" fill="${c}"/>
      <path d="M ${hx-hr*.95} ${hy-hr*.24} L ${hx} ${hy+hr*.82} L ${hx+hr*.95} ${hy-hr*.24} Z" fill="${c}"/></g>`;
  }
  return out;
}


/* ── 얼굴 리깅 SVG (사진 위에 겹침) ── */
function faceSVG(){
  const V=CHAR.view, M=CHAR.mouth, L=CHAR.eyeL, R=CHAR.eyeR;
  /* 눈 — 원본보다 크고 반짝이게. 아치형(웃는 눈)은 작게 보면 졸려 보여 쓰지 않습니다. */
  const eye=(e,side)=>{
    const {x,y,r}=e;
    return `<g class="eye eye-${side}">
      <circle cx="${x}" cy="${y}" r="${(r*1.32).toFixed(1)}" fill="#C9D2DA" opacity=".85"/>
      <circle cx="${x}" cy="${y}" r="${(r*1.16).toFixed(1)}" fill="#0B0C10"/>
      <g class="pupil">
        <circle cx="${x}" cy="${(y+r*.06).toFixed(1)}" r="${(r*.56).toFixed(1)}" fill="#04040A"/>
      </g>
      <circle cx="${(x-r*.34).toFixed(1)}" cy="${(y-r*.42).toFixed(1)}" r="${(r*.42).toFixed(1)}" fill="#fff"/>
      <circle cx="${(x+r*.36).toFixed(1)}" cy="${(y+r*.34).toFixed(1)}" r="${(r*.19).toFixed(1)}" fill="#fff" opacity=".62"/>
    </g>`;
  };
  /* 하트눈 — rx-heart 일 때만 보입니다 (평소엔 opacity:0) */
  const heart=(e)=>{
    const {x,y,r}=e, s=r*0.11;
    return `<path class="heart-eye" transform="translate(${(x-12*s).toFixed(1)},${(y-11*s).toFixed(1)}) scale(${s.toFixed(2)})"
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      fill="#F5679B"/>`;
  };
  const rA = (L.r + R.r)/2;
  const cheekY = ((L.y+R.y)/2 + rA*2.5).toFixed(1);
  const cw = (rA*1.45).toFixed(1), ch = (rA*0.95).toFixed(1);
  return `<svg class="face" viewBox="0 0 ${V.w} ${V.h}" aria-hidden="true">
    <g class="blush">
      <ellipse cx="${(L.x-rA*2.3).toFixed(1)}" cy="${cheekY}" rx="${cw}" ry="${ch}" fill="#FF7EA8"/>
      <ellipse cx="${(R.x+rA*2.3).toFixed(1)}" cy="${cheekY}" rx="${cw}" ry="${ch}" fill="#FF7EA8"/>
    </g>
    ${eye(L,'L')}${eye(R,'R')}
    ${heart(L)}${heart(R)}
    <ellipse class="mouth" cx="${M.x}" cy="${M.y}" rx="${M.rx}" ry="${M.ry}" fill="#6B4A33" opacity=".78"/>
    <path class="smile" d="M ${(M.x-M.rx*1.3).toFixed(1)} ${(M.y-M.ry*.5).toFixed(1)} Q ${M.x} ${(M.y+M.ry*1.2).toFixed(1)} ${(M.x+M.rx*1.3).toFixed(1)} ${(M.y-M.ry*.5).toFixed(1)}"
          fill="none" stroke="#6B4A33" stroke-width="${(M.ry*.62).toFixed(1)}" stroke-linecap="round" opacity=".8"/>
    ${accSVG(WEAR.items, WEAR.accColor)}
  </svg>`;
}


/* ── 벡터 모루 (사진이 없을 때) ── */
const PALETTE = {

let _uid = 0;
function moruBig(size, base){
  base = base || pickColor();
  const p = PALETTE[base] || PALETTE['#F56598'];

    const a = Math.random()*Math.PI*2, r = 52 + Math.random()*15;

    const L = 7 + Math.random()*14;
    const x2 = 100+Math.cos(a)*(r*0.86+L), y2 = 128+Math.sin(a)*(r*0.82+L);
    strands += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }
  const h = Math.round(size*230/200);
  return `<svg class="inner" width="${size}" height="${h}" viewBox="0 0 200 230" aria-label="모루믹">

      <stop offset="0%" stop-color="${p.light}"/><stop offset="72%" stop-color="${base}"/>

    </radialGradient>
  </defs>
  <circle cx="100" cy="34" r="19" fill="none" stroke="${p.ring}" stroke-width="6"/>
  <g stroke="${base}" stroke-width="2.6" stroke-linecap="round" opacity=".95">${strands}</g>
  <g filter="url(#f${id})">
    <ellipse cx="100" cy="130" rx="60" ry="55" fill="url(#g${id})"/>
    <ellipse cx="72" cy="106" rx="30" ry="27" fill="${p.light}" opacity=".5"/>
    <ellipse cx="130" cy="116" rx="26" ry="24" fill="${p.light}" opacity=".36"/>
    <ellipse cx="100" cy="168" rx="40" ry="22" fill="${p.dark}" opacity=".32"/>
  </g>
  <g class="eyes">
    <ellipse cx="82" cy="126" rx="9.5" ry="10.5" fill="#161616"/>
    <ellipse cx="119" cy="126" rx="9.5" ry="10.5" fill="#161616"/>
    <circle cx="85.5" cy="121.5" r="3.2" fill="#fff"/><circle cx="122.5" cy="121.5" r="3.2" fill="#fff"/>
  </g></svg>`;
}
function moruSVG(size, color, spikes){
  spikes = spikes || 13;
  const r=22, cx=24, cy=24, pts=[];
  for(let i=0;i<spikes*2;i++){

    pts.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">
    <polygon fill="${color}" points="${pts.join(' ')}"/>
    <circle cx="17.8" cy="22.4" r="2.5" fill="#141414"/><circle cx="30.2" cy="22.4" r="2.5" fill="#141414"/>
    <circle cx="18.6" cy="21.5" r=".8" fill="#fff"/><circle cx="31" cy="21.5" r=".8" fill="#fff"/></svg>`;
}

function cardMap(){
  const t=T[lang];
  // 실측 좌표 (연방점 기준 m) → SVG
  const P={stn:[-86,340], yb:[0,0], mn:[382,-108]};
  const sx=v=>((v+86)*0.40+42).toFixed(1), sy=v=>((340-v)*0.36+24).toFixed(1);
  const S={stn:[sx(P.stn[0]),sy(P.stn[1])], yb:[sx(P.yb[0]),sy(P.yb[1])], mn:[sx(P.mn[0]),sy(P.mn[1])]};
  const hereK = here==='main'?'mn':'yb';
  const ring=(k,c)=>`<circle cx="${S[k][0]}" cy="${S[k][1]}" r="12.5" fill="none" stroke="${c}" stroke-width="1.6" opacity=".55"/>`;
  return `<div class="card mapc">
    <h4><span class="dot"></span>${t.mapT}</h4>
    <svg viewBox="0 0 260 226">
      <line x1="${S.stn[0]}" y1="${S.stn[1]}" x2="${S.yb[0]}" y2="${S.yb[1]}" stroke="#B4B4B4" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
      <line x1="${S.yb[0]}" y1="${S.yb[1]}" x2="${S.mn[0]}" y2="${S.mn[1]}" stroke="${C.pink}" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round"/>
      <rect x="${(+S.yb[0]+ +S.mn[0])/2-27}" y="${(+S.yb[1]+ +S.mn[1])/2-9}" width="54" height="17" rx="8.5" fill="${C.pink}"/>
      <text x="${(+S.yb[0]+ +S.mn[0])/2}" y="${(+S.yb[1]+ +S.mn[1])/2+3.5}" text-anchor="middle" font-size="9.4" fill="#fff" font-weight="600">${t.mapWalk}</text>
      ${ring(hereK, here==='main'?C.pink:C.teal)}
      <circle cx="${S.stn[0]}" cy="${S.stn[1]}" r="6" fill="#00A84D"/><circle cx="${S.stn[0]}" cy="${S.stn[1]}" r="2.4" fill="#fff"/>
      <text x="${S.stn[0]}" y="${+S.stn[1]-11}" text-anchor="middle" font-size="9.6" fill="#414E5C" font-weight="600">${t.mapStn}</text>
      <circle cx="${S.yb[0]}" cy="${S.yb[1]}" r="8" fill="${C.teal}"/><circle cx="${S.yb[0]}" cy="${S.yb[1]}" r="3" fill="#fff"/>
      <text x="${S.yb[0]}" y="${+S.yb[1]+21}" text-anchor="middle" font-size="10" fill="#141414" font-weight="700">${STORES.yeonbang.name[lang]}</text>
      ${STORES.yeonbang.taxfree?`<text x="${S.yb[0]}" y="${+S.yb[1]+32}" text-anchor="middle" font-size="8.6" fill="${C.teal}" font-weight="600">${t.taxBadge}</text>`:''}
      <circle cx="${S.mn[0]}" cy="${S.mn[1]}" r="8" fill="${C.pink}"/><circle cx="${S.mn[0]}" cy="${S.mn[1]}" r="3" fill="#fff"/>
      <text x="${S.mn[0]}" y="${+S.mn[1]+21}" text-anchor="middle" font-size="10" fill="#141414" font-weight="700">${STORES.main.name[lang]}</text>
      ${STORES.main.taxfree?`<text x="${S.mn[0]}" y="${+S.mn[1]+32}" text-anchor="middle" font-size="8.6" fill="${C.pink}" font-weight="600">${t.taxBadge}</text>`:''}
      <text x="243" y="28" text-anchor="middle" font-size="10" fill="#B4B4B4" font-weight="700">N</text>
      <path d="M243 32 L243 44 M243 32 L240 37 M243 32 L246 37" stroke="#B4B4B4" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="mapleg">
      <span><i style="background:${C.pink}"></i>${STORES.main.name[lang]}</span>
      <span><i style="background:${C.teal}"></i>${STORES.yeonbang.name[lang]}</span>

    <div class="tip">${t.taxNote}</div></div>`;
}
function cardStores(){

    Object.values(STORES).map(s=>`<div class="store">
      <div class="t"><i style="background:${s.color}"></i>${s.name[lang]}${s.key===here?' <span style="font-size:10px;color:'+s.color+'">●</span>':''}</div>

   질문·답변을 고치실 때는 content.js 를,
   매장·가격을 고치실 때는 data.js 를 보시면 됩니다.

const $ = s => document.querySelector(s);
const app=$('#app'), speech=$('#speech'), charEl=$('#char'),
      sheetIn=$('#sheetIn'), navTop=$('#navTop'), navBody=$('#navBody');

const esc  = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ── 상태 ── */
let lang='ko', here='main', busy=false, charColor=C.pink;
let view='home', curCat=null, curQ=null;
const EMBEDDED = (function(){ try{ return window.self!==window.top; }catch(_){ return true; } })();

/* 매장·언어·모양은 주소에서 받습니다
   예) chat.html?store=yeonbang&lang=jp&ui=overlay
   ui=overlay  뒤 페이지를 어둡게 깔고 인형만 띄웁니다 (상자 없음)
   ui=panel    흰 판 위에 올립니다 (기본) */
const PARAM = new URLSearchParams(location.search);
if(STORES[PARAM.get('store')]) here = PARAM.get('store');
const UI = (PARAM.get('ui') === 'overlay' || window.NJ_UI === 'overlay') ? 'overlay' : 'panel';
document.body.classList.toggle('ui-overlay', UI === 'overlay');

/* 커스텀 만들기는 별도 화면입니다. 챗봇은 그리로 보내주기만 합니다. */

/* ── 인형 상태 ──
   WEAR 는 character.js 에서 선언합니다.
   챗봇에서는 크림색 그대로 두고, 색·소품 고르기는 custom.html 에서 합니다. */

/* 그림자를 여기서 입히면, 몸통이 계속 위아래로 움직이는 애니메이션과 겹쳐서
   브라우저가 이전 프레임 자국을 못 지우고 흐릿하게 남깁니다 (잔상의 실제 원인).
   그래서 이제 조각 이미지에는 그림자를 전혀 걸지 않고, 바닥의 정지된 #shadow 로만 표현합니다. */
function applyWear(){
  charEl.querySelectorAll('.rig img').forEach(im=>{ im.style.filter = ''; });
}
/* 소품은 얼굴 SVG 안에 그려지므로, 얼굴만 새로 그립니다 (사진은 그대로 둡니다) */
function refreshFace(){
  const rig = charEl.querySelector('.rig'); if(!rig) return;
  const old = rig.querySelector('.face'); if(old) old.remove();
  rig.insertAdjacentHTML('beforeend', faceSVG());
}

/* ── 글자 ── */
function md(t){
  return String(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function setSpeech(html, animate){
  if(animate!==false){ speech.style.animation='none'; void speech.offsetWidth; speech.style.animation=''; }
  speech.innerHTML = html; speech.scrollTop = 0;
}

/* ══════════ 인형 그리기 ══════════ */
function drawChar(recolor){
  if(recolor) charColor = pickColor();
  const old = charEl.querySelector('.inner'); if(old) old.remove();
  if(CHAR.mode==='photo'){
    const wrap = document.createElement('div');
    wrap.className = 'inner rig';
    if(CHAR.rigged){
      wrap.classList.add('parts');
      const mk = k => { const e=document.createElement('img');
        e.className='p '+k; e.alt=''; e.src=PARTS[k];
        const pv=CHAR.pivots[k]; if(pv) e.style.transformOrigin=pv[0]+'% '+pv[1]+'%';
        return e; };
      const b=document.createElement('img');
      b.className='base'; b.alt='모루믹'; b.src=PARTS.base;
      b.onerror=()=>{ CHAR.rigged=false; drawChar(false); };
      wrap.appendChild(b);
      ['legL','legR','armL','armR'].forEach(k=>wrap.appendChild(mk(k)));
    } else {
      const img=document.createElement('img'); img.alt='모루믹'; img.src=EMBED.photo;
      img.onerror=()=>{ CHAR.mode='vector'; drawChar(false); };
      wrap.appendChild(img);
    }
    wrap.insertAdjacentHTML('beforeend', faceSVG());
    charEl.appendChild(wrap);
  } else {
    const d=document.createElement('div'); d.innerHTML=moruBig(240, charColor);
    charEl.appendChild(d.firstElementChild);
  }
  const sh=$('#shadow'); if(sh) sh.style.opacity = (CHAR.mode==='photo') ? '' : '0';
  applyWear();
}

/* ── 자세 ── */
const POSES=['pose-point','pose-present','pose-wave','pose-show','pose-shrug'];
function setPose(name){ charEl.classList.remove(...POSES); if(name) charEl.classList.add('pose-'+name); }
function thinking(on){ charEl.classList.toggle('thinking',!!on); if(on){ talking(false); setPose(null); } }
function talking(on){ charEl.classList.toggle('talking',!!on); }
let _happyT=null;
function happyBurst(ms){
  clearTimeout(_happyT); charEl.classList.add('happy');
  _happyT=setTimeout(()=>charEl.classList.remove('happy'), ms||1600);
}

/* ══════════ 만지면 반응 ══════════ */
let rxTimer=null, rxRestore=null, tapCount=0, tapReset=null;
const SPARKS=['✦','♪','✧','·'];
const RX_ALL=['rx-tickle','rx-laugh','rx-notice','rx-wave','rx-hop','rx-pout','rx-purr',
  'rx-dizzy','rx-yawn','rx-idle',
  'rx-wake','rx-sneeze','rx-hic','rx-stretch','rx-spin','rx-hop2','rx-bye',
  'rx-heart','rx-wink','rx-shy','rx-surprised','rx-curious','rx-giggle'];

/* 가끔만 나오는 반응들.
   자주 나오면 성가시므로, 조용할 때 한 번씩만 꺼냅니다.
   2026-09-17: 팔 조각 없이도 안 깨지는 표정·몸짓 6종을 추가해 더 다양해졌습니다. */
const RARE = [
  ['rx-sneeze','sneeze',1200],
  ['rx-hic','hic',1700],
  ['rx-hop2','hop2',1600],
  ['rx-heart','heart',1600],
  ['rx-wink','wink',1300],
  ['rx-shy','shy',1700],
  ['rx-surprised','surprised',1100],
  ['rx-curious','curious',1800],
  ['rx-giggle','giggle',1500],
];
function clearRx(){ charEl.classList.remove(...RX_ALL); }
function spark(px,py){
  const el=document.createElement('span'); el.className='spark';
  el.textContent=pick(SPARKS);
  el.style.left=px+'px'; el.style.top=py+'px';
  el.style.color=pick([C.pink,C.teal,C.yellow,C.purple]);
  charEl.appendChild(el); setTimeout(()=>el.remove(), 900);
}
function flash(cls, zone, ms){
  const line = pick((REACT[lang]||REACT.ko)[zone]||['']);
  clearTimeout(rxTimer);
  if(rxRestore===null) rxRestore = speech.innerHTML;
  clearRx(); setPose(null); void charEl.offsetWidth;
  if(cls) charEl.classList.add(cls);
  if(!busy && line) setSpeech(md(line));
  rxTimer=setTimeout(()=>{
    clearRx();
    if(!busy && rxRestore!==null) setSpeech(rxRestore);
    rxRestore=null;
  }, ms||1500);
}
function react(ev){
  const r=charEl.getBoundingClientRect();
  const cx=(ev.clientX!==undefined?ev.clientX:(ev.touches&&ev.touches[0].clientX));
  const cy=(ev.clientY!==undefined?ev.clientY:(ev.touches&&ev.touches[0].clientY));
  if(cx===undefined) return;
  const fx=(cx-r.left)/r.width, fy=(cy-r.top)/r.height;
  spark(cx-r.left, cy-r.top);
  spark(cx-r.left+(Math.random()*26-13), cy-r.top-8);

  resetIdle();
  tapCount++; clearTimeout(tapReset);
  tapReset=setTimeout(()=>{ tapCount=0; }, 2200);

  let zone='belly';
  const noseX=CHAR.mouth.x/CHAR.view.w, noseY=CHAR.mouth.y/CHAR.view.h;
  if(Math.hypot((fx-noseX)*1.6, fy-noseY) < 0.075) zone='nose';
  else if(fy < 0.40) zone='head';
  else if(fy > 0.74) zone='leg';
  else if(fx < 0.30 || fx > 0.70) zone='arm';

  let cls='rx-tickle';
  /* 자고 있었다면 깜짝 놀라 깹니다 */
  if(charEl.classList.contains('sleepy') && tapCount===1){
    charEl.classList.remove('sleepy');
    zone='wake'; cls='rx-wake';
  }
  else if(tapCount>=9)    { zone='dizzy'; cls='rx-dizzy'; }
  else if(tapCount>=4)    { zone='lots';  cls='rx-laugh'; }
  else if(zone==='nose')  cls='rx-pout';
  else if(zone==='head')  cls='rx-notice';
  else if(zone==='belly') cls='rx-tickle';
  else if(zone==='arm')   cls='rx-wave';
  else                    cls='rx-hop';

  const line=pick((REACT[lang]||REACT.ko)[zone]);
  clearTimeout(rxTimer);
  if(rxRestore===null) rxRestore=speech.innerHTML;
  clearRx(); setPose(null); void charEl.offsetWidth;
  charEl.classList.add(cls);
  if(!busy) setSpeech(md(line));
  const dur = cls==='rx-wake' ? 1500 : cls==='rx-notice' ? 900 : cls==='rx-pout' ? 1800
            : cls==='rx-dizzy' ? 2200 : tapCount>=4 ? 1700 : 1400;
  rxTimer=setTimeout(()=>{
    clearRx();
    if(!busy && rxRestore!==null) setSpeech(rxRestore);
    rxRestore=null;
  }, dur);
}

/* ── 길게 누르면 쓰담쓰담 ── */
let pressT=null, pressing=false;
function startPress(){
  pressing=true;
  pressT=setTimeout(()=>{ if(pressing){ flash('rx-purr','purr',2600); happyBurst(2600); } }, 620);
}
function endPress(){ pressing=false; clearTimeout(pressT); }

/* ── 아무 말 없으면 스스로 두리번 ── */
let idleT=null, idleN=0;
function resetIdle(){ clearTimeout(idleT); idleN=0; idleT=setTimeout(idleTick, 22000); }
function idleTick(){
  if(busy || app.classList.contains('sheet') || $('#lsheet').classList.contains('on')){
    idleT=setTimeout(idleTick, 22000); return;
  }
  idleN++;
  /* 세 번에 한 번쯤 특별한 몸짓을 섞습니다 */
  if(idleN>=2 && Math.random()<0.34){
    const [cls,zone,ms]=pick(RARE);
    flash(cls,zone,ms);
    if(cls==='rx-spin'||cls==='rx-hop2') happyBurst(ms);
  }
  else if(idleN===1) flash('rx-idle','idle',2600);
  else if(idleN===2) flash(null,'idle',2200);
  else               flash('rx-yawn','yawn',2400);
  idleT=setTimeout(idleTick, idleN<3 ? 26000 : 40000);
}
function timeGreet(){
  const h=new Date().getHours();
  if(h<12 || h>=20) return (h>=20||h<9) ? 'closed' : 'morning';
  if(h<11)  return 'morning';
  if(h>=17) return 'evening';
  return null;
}

/* ══════════ 카드 시트 ══════════ */
function openSheet(html){ sheetIn.innerHTML=html; app.classList.add('sheet'); sheetIn.scrollTop=0; }
function closeSheet(){ app.classList.remove('sheet'); }
function showCards(list){

  openSheet(list.filter(k=>CARDS[k]).map(k=>CARDS[k]()).join(''));
}

/* ══════════════════════════════════════════════════════════════
   질문 네비게이터
   home   묶음 5개 + 커스텀 미리보기
   cat    한 묶음 안의 질문 목록
   answer 답변을 말한 뒤, 이어서 볼 질문 3개
   studio 커스텀 미리보기
   ══════════════════════════════════════════════════════════════ */
const CHIP_TONE=['','t','p','y'];
const catColor = id => { const c=(CATS.find(x=>x.id===id)||{}).color; return C[c]||C.pink; };

function setTop(html){ navTop.innerHTML=html; }
function backBtn(label){ return `<button class="back" id="navBack">‹ ${esc(label)}</button>`; }

/* ── 묶음 고르기 ── */
function renderHome(){

/* ── 답변 뒤에 이어서 볼 질문 ── */
function renderFollow(qid, cards){
  view='answer'; curQ=qid;
  const n=NAV[lang], item=Q[qid];
  setTop(`<span class="ttl">${esc(n.ask)}</span>`);
  const nx=(item.next||[]).filter(k=>Q[k]);

  /* 어떻게 가나요 / 다른 아이들도 보여주세요 는 버튼을 한 번 더 누르게 하지 않고
     바로 화면에 띄웁니다. */
  const AUTO_INLINE = { location:'stores', friends:'friends' };
  const autoKey = AUTO_INLINE[qid];
  const inlineExtra = autoKey==='stores' ? cardStores()
                     : autoKey==='friends' ? cardFriends()
                     : '';

  /* 나머지 카드는 손님이 원할 때만 올라옵니다 (자동으로 이미 보여준 카드는 버튼에서 뺍니다) */
  const cd=(cards||[]).filter(k=>CARDS[k]).filter(k=>k!==autoKey);
  const cardBtns = cd.length
    ? `<div class="cardbtns">` + cd.map(k=>
        `<button class="cardbtn" data-card="${k}">
           <span class="ci">▤</span>${esc((n.cards&&n.cards[k])||n.cardMore)}</button>`).join('')
      + `</div>`
    : '';

  /* go:'custom' 이 붙은 질문에는 커스텀 화면으로 가는 큰 버튼을 답니다 */
  const cta = item.go==='custom'
    ? `<button class="cta" id="toCustom">
         <span class="ct">${esc(n.customGo)}</span>
         <span class="cs">${esc(n.customHint)}</span>
         <span class="ar">→</span></button>`
    : '';

  navBody.innerHTML = cta + inlineExtra + cardBtns + `<div class="follow">` +
    nx.map((k,i)=>`<button class="fchip ${CHIP_TONE[i%4]}" data-q="${k}">${esc(Q[k].q[lang])}</button>`).join('') +
    `<button class="fchip plain" id="toHome">${esc(n.more)}</button>` +
    `</div>`;
  navBody.scrollTop=0;
  navBody.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
  $('#toHome').onclick = renderHome;
  if(cta) $('#toCustom').onclick = goCustom;
  navBody.querySelectorAll('[data-card]').forEach(b=>
    b.onclick=()=>showCards([b.dataset.card]));
}


/* ── 커스텀 화면으로 보내기 ──
   같은 사이트 안(iframe)이면 맨 위 페이지를 바로 이동시킵니다.
   이렇게 하면 nj-widget.js 쪽에서 메시지를 못 받아도 항상 동작합니다.
   다른 도메인이라 top 에 접근이 안 되면 그때만 메시지로 부탁합니다. */
function goCustom(){
  const url = CUSTOM_URL + (CUSTOM_URL.indexOf('?')<0?'?':'&')
            + 'store=' + encodeURIComponent(here) + '&lang=' + encodeURIComponent(lang);
  logTap('__custom__');
  /* 같은 문서 안에 껍데기가 있으면 그쪽에 맡깁니다 (미리보기). */
  if(typeof window.njGoCustom === 'function'){ window.njGoCustom(url); return; }
  try{
    if(window.top && window.top !== window.self){
      window.top.location.href = url;
      return;
    }
  }catch(_){
    try{ parent.postMessage({type:'nj:custom', url, store:here, lang},'*'); return; }catch(__){}
  }
  location.href = url;
}

/* ══════════ 답변하기 ══════════ */
async function ask(qid){
  const item=Q[qid]; if(!item || busy) return;
  resetIdle(); closeSheet();
  busy=true;
  rxRestore=null; clearTimeout(rxTimer); clearRx();
  navBody.innerHTML=''; setTop(`<span class="ttl">&nbsp;</span>`);

  thinking(true); await wait(340); thinking(false);

  const steps=(item.a[lang] || item.a.ko || []);
  const cards=steps.filter(s=>s.card).map(s=>s.card);
  const lines=steps.filter(s=>s.t);
  setPose(item.pose||'present'); talking(true);

  for(let i=0;i<lines.length;i++){
    setSpeech(md(lines[i].t));
    await wait(i===lines.length-1 ? 420 : 1500);
  }
  talking(false);
  await wait(160); setPose(null);
  busy=false;
  logTap(qid);
  renderFollow(qid, cards);   /* 카드는 저절로 올라오지 않고 버튼으로만 내놓습니다 */
}

/* ── 찾는 질문이 없을 때 ── */
async function sayMiss(){
  if(busy) return;
  busy=true; closeSheet();
  const n=NAV[lang];
  thinking(true); await wait(320); thinking(false);
  setPose('shrug'); talking(true);
  for(let i=0;i<n.missA.length;i++){
    setSpeech(md(n.missA[i]));
    await wait(i===n.missA.length-1 ? 420 : 1500);
  }
  talking(false); await wait(160); setPose(null);
  busy=false;
  setTop(`<span class="ttl">${esc(n.ask)}</span>`);
  navBody.innerHTML=`<div class="cardbtns">
      <button class="cardbtn" data-card="contact">
        <span class="ci">▤</span>${esc(n.cards.contact)}</button></div>
    <div class="follow">
      <button class="fchip plain" id="toHome">${esc(n.more)}</button></div>`;
  $('#toHome').onclick=renderHome;
  navBody.querySelectorAll('[data-card]').forEach(b=>
    b.onclick=()=>showCards([b.dataset.card]));
  logTap('__miss__');
}

/* ── 무엇을 눌렀는지 (서버가 있을 때만 기록) ── */
function logTap(id){
  if(!window.NJ_LOG_URL) return;
  try{
    fetch(window.NJ_LOG_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q:id, lang, store:here, t:Date.now()})}).catch(()=>{});
  }catch(_){}
}

const EMBED = { photo: PHOTO, framed: FRAMED };

/* ══════════════════════════════════════════════════════════════
   언어 · 초기화
   ══════════════════════════════════════════════════════════════ */
function langButtons(el){
  const cols=[C.pinkL,C.tealL,C.yellowL,C.purpleL,C.blueL];
  el.innerHTML=Object.values(T).map((l,i)=>
    `<button class="lb${i===4?' wide':''}" data-l="${l.code}" style="background:${cols[i]}">${l.label}</button>`).join('');
  [...el.children].forEach(b=>b.onclick=()=>chooseLang(b.dataset.l));
}

function chooseLang(l){
  lang=l;
  document.documentElement.lang={ko:'ko',en:'en',cn:'zh-CN',tw:'zh-TW',jp:'ja'}[l];
  $('#langBtn').textContent=T[l].label;
  $('#sheetT').textContent=T[l].sheetT;
  $('#sheetClose').textContent={ko:'닫기',en:'Close',cn:'关闭',tw:'關閉',jp:'閉じる'}[l];
  $('#homeBtn').setAttribute('aria-label', {ko:'처음으로',en:'Home',cn:'回首页',tw:'回首頁',jp:'ホームへ'}[l]);
  $('#closeBtn').setAttribute('aria-label', {ko:'닫기',en:'Close',cn:'关闭',tw:'關閉',jp:'閉じる'}[l]);
  $('#lsheet').classList.remove('on');
  $('#splash').classList.add('gone');
  try{ sessionStorage.setItem('nj-lang', l); }catch(_){}
  updateStatus(); closeSheet();
  drawChar(true);

  const tg=timeGreet();
  const hello=T[l].hello.join('<br><br>');
  const extra=tg ? pick((REACT[l]||REACT.ko)[tg]||['']) : '';
  setSpeech(extra ? extra+'<br><br>'+hello : hello);
  charEl.classList.toggle('sleepy', tg==='closed');

  happyBurst(2400); talking(true); setPose('wave');
  setTimeout(()=>{ talking(false); setPose(null); }, 2400);
  renderHome(); resetIdle();
}

function updateStatus(){
  const h=new Date().getHours(), open=h>=12&&h<20;
  const el=$('#stat');
  el.textContent = open ? T[lang].open : T[lang].closed;
  el.className = 'status'+(open?'':' off');
}

/* ── 첫 화면 인형 ── */
(function(){
  const el=$('#splashAv');
  const img=document.createElement('img');
  img.alt='모루믹'; img.src=EMBED.photo;
  img.onerror=()=>{ el.innerHTML=moruBig(200, C.pink); };
  el.appendChild(img);

  const HI=['안녕하세요!','반가워요','언어를 골라주세요','Hi!','你好','こんにちは'];
  let n=0;
  el.addEventListener('pointerdown', e=>{
    el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
    const r=el.getBoundingClientRect();
    const cx=(e.clientX!==undefined?e.clientX:r.left+r.width/2);
    const cy=(e.clientY!==undefined?e.clientY:r.top+r.height/2);
    for(let i=0;i<2;i++){
      const sp=document.createElement('span'); sp.className='spark';
      sp.textContent=pick(SPARKS); sp.style.color=pick([C.pink,C.teal,C.yellow,C.purple]);
      sp.style.left=(cx-r.left+(Math.random()*40-20))+'px';
      sp.style.top=(cy-r.top-6)+'px';
      el.style.position='relative'; el.appendChild(sp);
      setTimeout(()=>sp.remove(), 900);
    }
    const hey=document.querySelector('#splash .hey');
    if(hey){ hey.dataset.orig = hey.dataset.orig || hey.textContent;
      hey.textContent = HI[n++ % HI.length];
      clearTimeout(el._t); el._t=setTimeout(()=>{ hey.textContent=hey.dataset.orig; }, 1400); }
  });
})();

langButtons($('#langBtns')); langButtons($('#langBtns2'));
/* 통합 사이트에서는 index.html(언어 선택) 단계를 이미 거쳐 ?lang= 이 붙어 들어오므로,
   여기서 같은 언어 선택 화면을 또 보여주지 않고 바로 홈 화면으로 넘어갑니다. */
if (T[PARAM.get('lang')]) { chooseLang(PARAM.get('lang')); }
$('#langBtn').onclick = ()=>$('#lsheet').classList.add('on');
$('#lsheet').onclick  = e=>{ if(e.target.id==='lsheet') $('#lsheet').classList.remove('on'); };
$('#homeBtn').onclick = ()=>{ if(busy) return; app.classList.remove('studio'); closeSheet(); renderHome(); };
$('#dim').onclick = closeSheet;
$('#sheetClose').onclick = closeSheet;
$('#grab').onclick = closeSheet;

charEl.addEventListener('pointerdown', e=>{ react(e); startPress(); });
charEl.addEventListener('pointerup', endPress);
charEl.addEventListener('pointerleave', endPress);
charEl.addEventListener('pointercancel', endPress);
charEl.addEventListener('contextmenu', e=>e.preventDefault());

/* iframe 안에서 열렸으면 닫기 버튼을 보여줍니다 */
/* ── 닫을 때 손 흔들어 배웅 ── */
function sayBye(then){
  clearTimeout(rxTimer); clearRx(); setPose(null); busy=true;
  charEl.classList.add('rx-bye');
  setSpeech(md(pick((REACT[lang]||REACT.ko).bye)));
  setTimeout(()=>{ charEl.classList.remove('rx-bye'); busy=false; then(); }, 1150);
}

if(EMBEDDED){
  const b=$('#closeBtn'); b.hidden=false;
  b.onclick=()=>{ if(busy) return;
    sayBye(()=>{ try{ parent.postMessage({type:'nj:close'},'*'); }catch(_){} }); };
}

/* ── 모서리 파스텔 원 — 웹페이지와 같은 장식 ── */
(function(){
  const app=$('#app');
  [['b1',C.teal,  'left:-92px;top:-96px',     150],
   ['b2',C.purple,'right:-98px;top:-84px',    160],
   ['b3',C.pink,  'left:-96px;bottom:-92px',  150],
   ['b4',C.yellow,'right:-88px;bottom:-104px',140]].forEach(([id,col,pos,size])=>{
    let el=$('#'+id);
    if(!el){ el=document.createElement('div'); el.className='blob'; el.id=id;
      app.insertBefore(el, app.firstChild); }
    el.style.cssText = `width:${size}px;height:${size}px;background:${col};${pos}`;
    el.innerHTML='';
  });
})();

drawChar(true);
setInterval(updateStatus, 60000);

/* 스플래시(모루믹 첫 인사) 화면은 이제 자동으로 넘어가지 않습니다.
