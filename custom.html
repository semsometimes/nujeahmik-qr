<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<title>nujeahmik · 커스텀 만들기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 브랜드 파스텔 */
  --pink:#F5679B;   --teal:#3FC7B4;   --yellow:#FBCF4B;
  --purple:#A98BEE; --blue:#8CB4F0;
  /* 버튼용 조금 더 부드러운 톤 */
  --pinkL:#F291AE;  --tealL:#7ED4C0;  --yellowL:#FBD46D;
  --purpleL:#B296EE;--blueL:#8CB4F0;
  /* 글자 */
  --ink:#1A1A1E; --ink2:#4A4A52; --grey:#8E8E96; --sep:#C4C4CE;
  /* 바탕과 선 */
  --paper:#F5F4F8; --light:#EFEEF4; --line:#E8E7EE; --white:#fff;
  --pinksoft:#FDEDF3; --tealsoft:#E4F7F3;
  /* 그림자 — 아주 옅게 두 겹 */
  --sh1:0 1px 3px rgba(30,30,60,.045), 0 6px 16px rgba(30,30,60,.055);
  --sh2:0 2px 6px rgba(30,30,60,.05), 0 14px 34px rgba(30,30,60,.08);
  /* 모서리 */
  --r-card:20px; --r-row:16px; --r-pill:999px;
}
/* ══════════════════════════════════════════════════════════════
   커스텀 만들기 — 별도 화면
   매장 안내판의 5단계를 그대로 따라갑니다.
     1) 인형 고르기  2) 아이템 고르기  3) 와이어링 색
     4) 붙일 자리 정하기  5) 카운터에 보여주기
   ══════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"IBM Plex Sans KR",
    -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;line-height:1.65;letter-spacing:-.015em;
  word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}

/* 화면 높이에 딱 맞춥니다.
   min-height 로 두면 내용만큼 늘어나서 아래 계산칸이 화면 밖으로 밀려납니다. */
#cu{position:relative;width:100%;max-width:520px;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
@media(min-width:560px){
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  body{background:#E9E8EF}
  #cu{min-height:0;height:min(920px,calc(100dvh - 40px));border-radius:30px;
    box-shadow:var(--sh2)}
}

/* ── 머리말 ── */
#cuTop{position:relative;z-index:8;flex:0 0 auto;display:flex;align-items:center;
  gap:9px;padding:13px 15px 8px}
#cuTop .mark{font-size:13.5px;font-weight:800;letter-spacing:-.03em;font-style:italic;
  background:var(--white);border-radius:var(--r-pill);padding:7px 14px;box-shadow:var(--sh1)}
#cuTitle{font-size:12.8px;color:var(--grey);font-weight:600;letter-spacing:-.02em;
  white-space:nowrap}
@media(max-width:430px){ #cuTitle{display:none} }
#cuTop .sp{margin-left:auto}
#cuTop button{border:none;background:var(--white);box-shadow:var(--sh1);
  border-radius:var(--r-pill);padding:8px 14px;font-size:11.8px;font-weight:700;
  color:var(--ink2);letter-spacing:-.02em}
#cuTop button:active{transform:scale(.94)}
#backBtn{padding:6px 11px;font-size:15px;line-height:1}

/* ── 인형 미리보기 ── */
#cuView{position:relative;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;padding:2px 16px 10px;overflow:hidden}
#cuStage{position:relative;height:clamp(200px,30vh,290px);
  display:flex;align-items:center;justify-content:center}
#cuDoll{position:relative;height:96%;max-height:96%;z-index:1;
  animation:cuFloat 4.6s ease-in-out infinite;transform-origin:50% 92%}
@keyframes cuFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#cuDoll .body{height:100%;width:auto;
  filter:drop-shadow(0 14px 22px rgba(40,40,80,.18))}
/* 아이템 — 손으로 끌어 옮길 수 있습니다 */
#cuDoll .worn{position:absolute;cursor:grab;touch-action:none;
  transition:left .3s cubic-bezier(.2,.9,.3,1.2),top .3s cubic-bezier(.2,.9,.3,1.2)}
#cuDoll .worn img{width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;
  filter:drop-shadow(0 3px 5px rgba(20,20,20,.22))}
#cuDoll .worn.grab{cursor:grabbing;z-index:3}
#cuDoll .worn.moving{transition:none}
#cuDoll .worn.moving img{filter:drop-shadow(0 7px 12px rgba(20,20,20,.34))}
#cuStage.dragging{cursor:grabbing}
/* 끌 수 있다는 걸 알려주는 테두리 — 처음 몇 초만 */
@keyframes wornHint{0%,88%{box-shadow:none}94%{box-shadow:0 0 0 2px rgba(245,101,152,.5)}}
#cuDoll .worn{border-radius:8px;animation:wornHint 3.2s ease-in-out 3}
.spark{position:absolute;font-size:15px;pointer-events:none;z-index:4;
  animation:cuSpark .85s ease-out forwards}
@keyframes cuSpark{0%{opacity:0;transform:translate(0,0) scale(.5)}
  30%{opacity:1}100%{opacity:0;transform:translate(0,-26px) scale(1.1)}}

/* ── 단계 ── */
#cuBody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:4px 15px 14px}
#cuBody::-webkit-scrollbar{width:0}
.stg{display:grid;gap:13px}
.stg > section{background:var(--white);border:1px solid var(--line);
  border-radius:16px;padding:12px 13px 13px}
.lab{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lab .no{flex:0 0 19px;width:19px;height:19px;border-radius:50%;color:#fff;
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lab .lt{font-size:14px;font-weight:800;letter-spacing:-.03em}
.lab .lh{font-size:11.2px;color:var(--grey);margin-left:auto;font-weight:500}

/* 인형 고르기 */
.dolls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
#cuStage{height:clamp(190px,28vh,270px);aspect-ratio:auto;width:auto}
.doll{position:relative;border:2px solid transparent;border-radius:var(--r-row);
  padding:5px 4px 4px;background:var(--light);transition:transform .14s,border-color .18s,background .18s}
.doll:active{transform:scale(.94)}
.doll.on{border-color:var(--pink);background:var(--pinksoft)}
.doll img{width:100%;height:auto;aspect-ratio:1/1.1;object-fit:contain}
.doll span{display:block;font-size:9.8px;font-weight:600;line-height:1.3;
  letter-spacing:-.04em;text-align:center;color:var(--grey);margin-top:3px;
  word-break:keep-all}
.doll.on span{color:var(--pink);font-weight:700}

/* 아이템 고르기 */
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.it{display:flex;flex-direction:column;align-items:center;gap:3px;
  border:2px solid transparent;border-radius:var(--r-row);padding:7px 3px 5px;
  background:var(--light);transition:transform .14s,border-color .18s,background .18s}
.it:active{transform:scale(.93)}
.it.on{border-color:var(--pink);background:var(--pinksoft)}
.it .ph{height:38px;display:flex;align-items:center;justify-content:center;width:100%}
.it .ph img{max-height:38px;width:auto;max-width:100%;object-fit:contain}
.it span{font-size:9.6px;font-weight:500;line-height:1.2;letter-spacing:-.03em;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.it.on span{color:var(--pink);font-weight:700}

/* 와이어링 색 */
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
.sw button{aspect-ratio:1/1;border-radius:50%;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .16s}
.sw button:active{transform:scale(.88)}
.sw button.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),
  0 0 0 2.5px var(--white),0 0 0 4.5px var(--ink)}

/* 붙일 자리 */
.picked{display:grid;gap:7px}
.pr{display:flex;align-items:center;gap:9px;border:none;
  border-radius:var(--r-row);padding:8px 10px;background:var(--light)}
.pr .th{flex:0 0 30px;width:30px;height:30px;display:flex;align-items:center;
  justify-content:center;background:var(--light);border-radius:8px}
.pr .th img{max-width:24px;max-height:24px;width:auto;object-fit:contain}
.pr .nm{flex:1 1 auto;font-size:12.2px;font-weight:600;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .sp{display:flex;gap:4px;flex:0 0 auto}
.pr .sp button{font-size:10.6px;font-weight:700;color:var(--grey);
  border:none;background:var(--white);border-radius:var(--r-pill);padding:5px 9px;line-height:1.2}
.pr .sp button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.pr .sp button.rst{background:var(--pinksoft);color:var(--pink)}
.dragTip{font-size:11px;color:var(--grey);text-align:center;padding:9px 4px 0;line-height:1.5}
.empty{font-size:12px;color:var(--grey);text-align:center;padding:10px 0 4px}

.note{font-size:11.4px;color:var(--grey);line-height:1.65;text-align:center;padding:0 6px}

/* ── 계산 · 다음 ── */
#cuFoot{flex:0 0 auto;background:var(--white);border-top:none;
  padding:11px 15px calc(13px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;box-shadow:0 -4px 22px rgba(40,40,80,.07)}
#cuFoot .bp{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
#cuFoot .bd{font-size:11.4px;color:var(--grey);line-height:1.4}
#cuFoot .go{margin-left:auto;background:var(--pink);color:#fff;font-size:13.4px;
  font-weight:800;border-radius:var(--r-pill);padding:14px 22px;letter-spacing:-.03em;
  box-shadow:0 3px 10px rgba(245,103,155,.32);transition:transform .14s}
#cuFoot .go:active{transform:scale(.94)}

/* ── 요약 시트 ── */
#cuDim{position:absolute;top:0;right:0;bottom:0;left:0;z-index:14;
  background:rgba(20,20,20,.34);opacity:0;visibility:hidden;transition:.28s}
#cu.sheet #cuDim{opacity:1;visibility:visible}
#cuSheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--white);
  border-radius:28px 28px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:86%;overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.9,.3,1.05);
  box-shadow:0 -8px 34px rgba(20,30,45,.16)}
#cuSheetIn{overflow-y:auto;scrollbar-width:none;flex:1 1 auto;min-height:0}
#cuSheetIn::-webkit-scrollbar{width:0}
#cuSheetFoot{flex:0 0 auto}
#cu.sheet #cuSheet{transform:none}
#cuGrab{padding:6px 0 10px;display:flex;justify-content:center}
#cuGrab i{width:38px;height:4px;border-radius:2px;background:var(--line);display:block}
#cuSheet h4{font-size:14.5px;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;gap:7px}
#cuSheet h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--pink);display:block}
.shopBtn{display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin-top:14px;padding:15px;border-radius:var(--r-row);
  background:var(--pink);color:#fff;font-size:13.5px;font-weight:700;
  text-decoration:none;box-shadow:0 3px 8px rgba(245,101,152,.28);
  transition:transform .14s}
.shopBtn:active{transform:scale(.97)}
.shopBtn .ar{font-size:12px;opacity:.85}
#cuClose{width:100%;margin-top:9px;padding:14px;border-radius:var(--r-row);
  background:var(--light);font-size:13px;font-weight:600;color:var(--ink2)}

.recap{display:grid;gap:10px}
.recap .row{display:flex;align-items:flex-start;gap:10px;font-size:13.2px}
.recap .row .k{flex:0 0 62px;color:var(--grey);font-size:12px;padding-top:2px}
.recap .row .v{font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  min-width:0}
.recap .row .v i{width:15px;height:15px;border-radius:50%;display:inline-block;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.recap .row .v .mini{display:inline-flex;align-items:center;gap:5px;background:var(--light);
  border-radius:999px;padding:3px 10px 3px 4px;font-size:12px}
.recap .row .v .mini img{width:20px;height:20px;object-fit:contain}
.recap .shot{display:flex;justify-content:center;padding:2px 0 6px}
.recap .shot .in{position:relative;height:150px;display:flex;align-items:center;
  justify-content:center}
.recap .shot img.body{height:150px;width:auto}
.recap .tot{display:flex;align-items:baseline;gap:10px;padding-top:11px;
  border-top:1px solid var(--line)}
.recap .tot .k{flex:0 0 62px;color:var(--grey);font-size:12px}
.recap .tot b{font-size:21px;font-weight:700}
.steps{display:grid;gap:9px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.steps .st{display:flex;gap:10px;align-items:flex-start;font-size:12.8px}
.steps .st .n{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:var(--light);
  font-size:10.5px;font-weight:700;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps .st .sd{display:block;font-size:11.2px;color:var(--grey);line-height:1.45}
.tip{background:var(--pinksoft);border-radius:10px;padding:10px 12px;font-size:12.2px;
  color:var(--ink2);margin-top:13px;line-height:1.6}

#cuSheetFoot{position:relative;padding-top:12px}
#cuSheetFoot::before{content:'';position:absolute;top:0;left:-16px;right:-16px;height:1px;
  background:var(--line)}
.tip.instore{background:var(--light);color:var(--grey);font-size:11.6px;margin-top:8px}

/* ── 언어 고르기 ── */
#cuLangSheet{position:absolute;top:0;right:0;bottom:0;left:0;z-index:20;
  background:rgba(20,20,20,.34);display:flex;align-items:flex-end;
  opacity:0;visibility:hidden;transition:.25s}
#cuLangSheet.on{opacity:1;visibility:visible}
#cuLangSheet .in{width:100%;background:var(--white);border-radius:26px 26px 0 0;
  padding:20px 18px 26px;transform:translateY(100%);transition:transform .3s}
#cuLangSheet.on .in{transform:none}
#cuLangSheet h5{font-size:14.5px;font-weight:700;margin-bottom:13px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb{height:58px;border-radius:var(--r-pill);display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.02em;
  box-shadow:var(--sh1);transition:transform .16s}
.lb:active{transform:scale(.95)}
.lb.wide{grid-column:1/-1}

@media(prefers-reduced-motion:reduce){
  #cuDoll{animation:none}
  #cuSheet,#cuLangSheet,#cuLangSheet .in,#cuDim,#cuDoll .worn{transition:none}
  #cuDoll .worn{animation:none}
}
</style>
</head>
<body>
<div id="cu">
  <div id="cuTop">
    <button id="backBtn" aria-label="뒤로">‹</button>
    <span class="mark">nujeahmik</span>
    <span id="cuTitle" style="font-size:12.5px;color:var(--grey);font-weight:600">커스텀 만들기</span>
    <span class="sp"></span>
    <button id="resetBtn">처음부터</button>
    <button id="cuLangBtn">한국어</button>
  </div>

  <div id="cuView">
    <div id="cuStage"><div id="cuDoll"></div></div>
  </div>

  <div id="cuBody"></div>
  <div id="cuFoot"></div>

  <div id="cuDim"></div>
  <div id="cuSheet">
    <div id="cuGrab"><i></i></div>
    <div id="cuSheetIn"></div>
    <div id="cuSheetFoot"></div>
  </div>

  <div id="cuLangSheet"><div class="in" id="cuLang">
    <h5>언어를 선택해 주세요</h5>
    <div class="langs" id="cuLangs"></div>
  </div></div>
</div>
<!-- 파일 하나로 열립니다. -->
<script>


/* ════════════════════════════════════════════════════════════════
   캐릭터 좌표와 그리기
   ════════════════════════════════════════════════════════════════ */
/* 누제믹 — 캐릭터 렌더링 엔진 (v18 에서 그대로 가져옴)
   사진을 바꾸면 CHAR 좌표와 PARTS 이미지를 다시 잡아야 합니다. */

/* ══════════ 캐릭터 설정 ══════════
   'photo'  실사 사진 · 배경 제거본            → public/moru.png       (기본)
   'framed' 실사 사진 · 원본 그대로, 원형 프레임 → public/moru_photo.jpg
   'vector' SVG 벡터 (사진이 없을 때 자동 대체)
   ※ 새 사진을 받으면 위 파일만 교체하면 됩니다.                        */
/* 인형이 무엇을 입고 있는지. faceSVG() 가 이 값을 봅니다.
   챗봇에서는 크림색·소품 없음 그대로, 커스텀 화면에서만 바뀝니다. */
const WEAR = { color:'cream', items:{}, accColor:'#F56598' };

const CHAR = {
  mode : 'photo',
  src  : 'moru.png',
  framedSrc : 'moru_photo.jpg',
  /* 얼굴 리깅 좌표 — 사진 원본 픽셀 기준.
     사진을 바꾸면 이 값도 새 사진에 맞춰 조정해야 합니다.        */
  view  : { w:962, h:1247 },
  eyeL  : { x:414, y:418, r:26 },
  eyeR  : { x:554, y:419, r:26 },
  mouth : { x:484, y:505, rx:20, ry:13 },
  /* 팔·다리 리그. 사진을 바꾸면 부위 이미지도 새로 잘라야 합니다.
     rigged:false 로 두면 통짜 사진 한 장만 씁니다.                  */
  rigged : true,
  pivots : {                       // 회전축 (사진 크기 대비 %)
    armL : [28.3, 50.7],
    armR : [72.1, 50.7],
    legL : [37.0, 79.8],
    legR : [63.4, 79.8]
  }
};

/* 브랜드 색 — CSS 의 :root 와 같은 값입니다 */
const C = {
  pink:'#F5679B', teal:'#3FC7B4', yellow:'#FBCF4B', purple:'#A98BEE', blue:'#8CB4F0',
  pinkL:'#F291AE', tealL:'#7ED4C0', yellowL:'#FBD46D', purpleL:'#B296EE', blueL:'#8CB4F0'
};
const AV_COLORS = [C.pink, C.teal, C.yellow, C.purple];
const pickColor = () => AV_COLORS[Math.floor(Math.random()*AV_COLORS.length)];
const ICON_COLORS = [C.pink, C.teal, C.purple];
const pickIconColor = () => ICON_COLORS[Math.floor(Math.random()*ICON_COLORS.length)];


/* ── 소품 SVG (얼굴 좌표 기준) ── */
function accSVG(items, col){
  const V=CHAR.view, L=CHAR.eyeL, R=CHAR.eyeR, M=CHAR.mouth;
  const cx=(L.x+R.x)/2, ey=(L.y+R.y)/2, r=(L.r+R.r)/2;
  const W=V.w, H=V.h;
  /* 인체 기준선 — 사진 크기 대비 비율 */
  const hatBrim = H*0.185, hatPeak = H*0.062, hatW = W*0.30;
  const crBase  = H*0.160, crTop   = H*0.072, crW  = W*0.21;
  const neckY   = H*0.472, scW = W*0.27;
  const earY    = H*0.150, headW = W*0.62;
  const c = col || '#F56598';
  let out='';

  if(items.glasses){
    out+=`<g class="acc" opacity=".96">
      <circle cx="${L.x}" cy="${L.y}" r="${r*1.7}" fill="#fff" opacity=".16"/>
      <circle cx="${R.x}" cy="${R.y}" r="${r*1.7}" fill="#fff" opacity=".16"/>

  if(items.sunglass){

    out+=`<g class="acc">
      <rect x="${L.x-w*1.15}" y="${ey-h*1.25}" width="${(R.x-L.x)+w*2.3}" height="${h*.34}" rx="${h*.17}" fill="#1B1B22"/>

      <ellipse cx="${R.x}" cy="${ey+r*.1}" rx="${w}" ry="${h}" fill="#1B1B22"/>
      <path d="M ${L.x+w} ${ey} L ${R.x-w} ${ey}" stroke="#1B1B22" stroke-width="${r*.35}"/>
      <ellipse cx="${L.x-r*.55}" cy="${ey-r*.5}" rx="${r*.55}" ry="${r*.32}" fill="#fff" opacity=".32"/>
      <ellipse cx="${R.x-r*.55}" cy="${ey-r*.5}" rx="${r*.55}" ry="${r*.32}" fill="#fff" opacity=".32"/>
    </g>`;
  }
  if(items.hat){
    out+=`<g class="acc">
      <path d="M ${cx-hatW} ${hatBrim} Q ${cx} ${hatPeak-H*0.02} ${cx+hatW} ${hatBrim} Z" fill="${c}"/>
      <rect x="${cx-hatW*1.06}" y="${hatBrim-H*0.018}" width="${hatW*2.12}" height="${H*0.036}" rx="${H*0.018}" fill="${c}" opacity=".9"/>
      <circle cx="${cx}" cy="${hatPeak-H*0.005}" r="${W*0.038}" fill="${c}" opacity=".95"/>
    </g>`;
  }
  if(items.crown){
    const w=crW;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${crBase} L ${cx-w} ${crTop+H*0.030} L ${cx-w*0.5} ${crBase-H*0.030}
               L ${cx} ${crTop} L ${cx+w*0.5} ${crBase-H*0.030} L ${cx+w} ${crTop+H*0.030} L ${cx+w} ${crBase} Z"
            fill="#FEC93D" stroke="#D9A417" stroke-width="${W*0.006}"/>

      <circle cx="${cx+w*0.62}" cy="${crBase-H*0.010}" r="${W*0.013}" fill="#F56598"/>
    </g>`;
  }
  if(items.scarf){
    const y=neckY, w=scW, th=H*0.032;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${y} Q ${cx} ${y+th*1.7} ${cx+w} ${y}
               L ${cx+w} ${y+th} Q ${cx} ${y+th*2.8} ${cx-w} ${y+th} Z" fill="${c}"/>
      <path d="M ${cx-w*0.26} ${y+th*2.2} h ${w*0.52} l -${w*0.06} ${H*0.115} h -${w*0.40} Z" fill="${c}" opacity=".94"/>
    </g>`;
  }
  if(items.ribbon){
    const y=neckY-H*0.030, w=W*0.115, hh=H*0.034;
    out+=`<g class="acc">
      <path d="M ${cx-w} ${y-hh} L ${cx-w*0.22} ${y} L ${cx-w} ${y+hh} Z" fill="${c}"/>
      <path d="M ${cx+w} ${y-hh} L ${cx+w*0.22} ${y} L ${cx+w} ${y+hh} Z" fill="${c}"/>

  }
  if(items.flower){
    const fx=cx+headW*0.42, fy=earY+H*0.035, pr=W*0.028;
    let pet='';
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      const px=(fx+Math.cos(a)*pr*1.05).toFixed(1), py=(fy+Math.sin(a)*pr*1.05).toFixed(1);
      pet+=`<ellipse cx="${px}" cy="${py}" rx="${pr*0.72}" ry="${pr*0.5}" transform="rotate(${(i*60).toFixed(0)} ${px} ${py})" fill="#fff"/>`; }
    out+=`<g class="acc">${pet}<circle cx="${fx}" cy="${fy}" r="${pr*0.62}" fill="#FEC93D"/></g>`;
  }
  if(items.star){
    const sx=cx-headW*0.44, sy=earY+H*0.02, R1=W*0.042;
    let pts=[];
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?R1*.44:R1;

  if(items.heart){
    const hx=cx+headW*0.44, hy=earY+H*0.02, hr=W*0.04;
    out+=`<g class="acc">
      <circle cx="${hx-hr*.44}" cy="${hy-hr*.3}" r="${hr*.52}" fill="${c}"/>
      <circle cx="${hx+hr*.44}" cy="${hy-hr*.3}" r="${hr*.52}" fill="${c}"/>

  }
  return out;
}


/* ── 얼굴 리깅 SVG (사진 위에 겹침) ── */
function faceSVG(){
  const V=CHAR.view, M=CHAR.mouth, L=CHAR.eyeL, R=CHAR.eyeR;
  /* 눈 — 원본보다 크고 반짝이게. 아치형(웃는 눈)은 작게 보면 졸려 보여 쓰지 않습니다. */
  const eye=(e)=>{
    const {x,y,r}=e;
    return `<g class="eye">
      <circle cx="${x}" cy="${y}" r="${(r*1.32).toFixed(1)}" fill="#C9D2DA" opacity=".85"/>
      <circle cx="${x}" cy="${y}" r="${(r*1.16).toFixed(1)}" fill="#0B0C10"/>
      <g class="pupil">
        <circle cx="${x}" cy="${(y+r*.06).toFixed(1)}" r="${(r*.56).toFixed(1)}" fill="#04040A"/>
      </g>
      <circle cx="${(x-r*.34).toFixed(1)}" cy="${(y-r*.42).toFixed(1)}" r="${(r*.42).toFixed(1)}" fill="#fff"/>
      <circle cx="${(x+r*.36).toFixed(1)}" cy="${(y+r*.34).toFixed(1)}" r="${(r*.19).toFixed(1)}" fill="#fff" opacity=".62"/>
    </g>`;
  };
  const rA = (L.r + R.r)/2;
  const cheekY = ((L.y+R.y)/2 + rA*2.5).toFixed(1);
  const cw = (rA*1.45).toFixed(1), ch = (rA*0.95).toFixed(1);
  return `<svg class="face" viewBox="0 0 ${V.w} ${V.h}" aria-hidden="true">
    <g class="blush">
      <ellipse cx="${(L.x-rA*2.3).toFixed(1)}" cy="${cheekY}" rx="${cw}" ry="${ch}" fill="#FF7EA8"/>
      <ellipse cx="${(R.x+rA*2.3).toFixed(1)}" cy="${cheekY}" rx="${cw}" ry="${ch}" fill="#FF7EA8"/>
    </g>
    ${eye(L)}${eye(R)}
    <ellipse class="mouth" cx="${M.x}" cy="${M.y}" rx="${M.rx}" ry="${M.ry}" fill="#6B4A33" opacity=".78"/>
    <path class="smile" d="M ${(M.x-M.rx*1.3).toFixed(1)} ${(M.y-M.ry*.5).toFixed(1)} Q ${M.x} ${(M.y+M.ry*1.2).toFixed(1)} ${(M.x+M.rx*1.3).toFixed(1)} ${(M.y-M.ry*.5).toFixed(1)}"
          fill="none" stroke="#6B4A33" stroke-width="${(M.ry*.62).toFixed(1)}" stroke-linecap="round" opacity=".8"/>
    ${accSVG(WEAR.items, WEAR.accColor)}
  </svg>`;
}

   매장 안내판의 5단계를 그대로 따릅니다.
     1) 모루 인형 색상 선택하기
     2) 아이템 선택하기 (추가 시 개당 2,000원)
     3) 와이어링 색상 선택하기
     4) 아이템 붙일 위치 정하기
     5) 바구니에 담아 카운터 직원에게 건네주세요

   인형과 아이템은 매장 실물 사진입니다 (pieces.js).
   화면 미리보기이므로 실제 재고·구성과 다를 수 있습니다.
   ══════════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);
const cu = $('#cu'), stage = $('#cuDoll'), body = $('#cuBody');
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pick = a => a[Math.floor(Math.random()*a.length)];

/* 온라인 구매처 — 주소가 바뀌면 여기만 고치시면 됩니다 */
const SHOP_URL = 'https://smartstore.naver.com/nujeahmik/products/13763791593';

const PARAM = new URLSearchParams(location.search);
let lang = 'ko';
let here = STORES[PARAM.get('store')] ? PARAM.get('store') : 'main';

/* ── 고른 것 ── (개수 제한은 없습니다. 담는 만큼 값이 올라갑니다) */
const PICK = { base:'rainbow', items:[], wire:C.pink };   // items: [{id, spot}]
const byId = (arr,id) => arr.find(x => x.id === id);
const baseOf = () => byId(BASES, PICK.base) || BASES[0];
const kindOf = () => baseOf().kind;
/* 아이템이 놓일 자리.
   인형마다 사진 속 눈 위치가 달라서, 그 눈을 기준으로 계산합니다.
   손으로 옮겼으면(p.x) 그 자리를 그대로 씁니다. */
function posOf(p, b){
  if(p.x != null && p.y != null) return [p.x, p.y];
  const base = b || baseOf();
  const o = OFFSET[p.spot] || OFFSET.face;
  return [base.eye[0] + o[0], base.eye[1] + o[1]];
}
const itemCount = () => PICK.items.length;
const customPrice = () => 20000 + 2000 * Math.max(0, itemCount()-1);
const WIRES = [C.pink, C.teal, C.yellow, C.purple, '#E1524C', '#5AA9E6', '#141414'];

/* ══════════ 인형 그리기 ══════════ */
function drawDoll(){
  const b = byId(BASES, PICK.base) || BASES[0];
  stage.innerHTML = `<img class="body" src="${b.src}" alt="">`;
  PICK.items.forEach(p => {
    const it = byId(ITEMS, p.id); if(!it) return;
    const [ax,ay] = posOf(p);
    const el = document.createElement('div');
    el.className = 'worn';
    el.dataset.wid = p.id;
    el.style.width = (it.w*100) + '%';
    el.style.left  = (ax*100) + '%';
    el.style.top   = (ay*100) + '%';
    el.style.transform = `translate(-50%,-50%) rotate(${it.r}deg)`;
    el.innerHTML = `<img src="${it.src}" alt="" draggable="false">`;
    dragify(el, p);
    stage.appendChild(el);
  });
}

/* ── 손으로 끌어서 옮기기 ──
   붙일 자리 버튼으로 크게 정하고, 미세한 위치는 직접 끌어 맞춥니다. */
function dragify(el, p){
  let moved = false;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    if(!r.width) return;
    moved = false;
    el.setPointerCapture(e.pointerId);
    el.classList.add('grab');
    stage.classList.add('dragging');
    const move = ev => {
      const x = (ev.clientX - r.left) / r.width;
      const y = (ev.clientY - r.top)  / r.height;
      p.x = Math.max(-0.06, Math.min(1.06, x));
      p.y = Math.max(-0.06, Math.min(1.06, y));
      el.style.left = (p.x*100) + '%';
      el.style.top  = (p.y*100) + '%';
      if(!moved){ moved = true; el.classList.add('moving'); }
    };
    const up = ev => {
      el.releasePointerCapture(e.pointerId);
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      el.classList.remove('grab','moving');
      stage.classList.remove('dragging');
      if(moved){ spark(2); render(); }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}

function spark(n){
  const r = stage.getBoundingClientRect();
  for(let i=0;i<(n||3);i++){
    const el = document.createElement('span');
    el.className = 'spark';
    el.textContent = pick(['✦','♪','✧','·']);
    el.style.left = (r.width*(.2+Math.random()*.6)) + 'px';
    el.style.top  = (r.height*(.15+Math.random()*.4)) + 'px';
    el.style.color = pick([C.pink,C.teal,C.yellow,C.purple]);
    stage.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

/* ── 고르기 ── */
function setBase(id){ if(byId(BASES,id)){ PICK.base=id; drawDoll(); } }
function toggleItem(id){
  const i = PICK.items.findIndex(p => p.id === id);
  if(i >= 0){ PICK.items.splice(i,1); }
  else {
    const it = byId(ITEMS, id); if(!it) return false;
    PICK.items.push({ id, spot: it.spot, x: null, y: null });
  }
  drawDoll(); return true;
}
function setSpot(id, spot){
  const p = PICK.items.find(x => x.id === id);
  if(p){ p.spot = spot; p.x = p.y = null; drawDoll(); }   // 자리를 고르면 제자리로
}
function resetPos(id){
  const p = PICK.items.find(x => x.id === id);
  if(p){ p.x = p.y = null; drawDoll(); render(); }
}
function resetAll(){ PICK.base='rainbow'; PICK.items=[]; PICK.wire=C.pink; drawDoll(); render(); }

const won = n => n.toLocaleString() + (lang==='ko' ? '원' : lang==='jp' ? 'ウォン' : ' KRW');

        <span class="lt">${esc(n.s1)}</span>
        <span class="lh">${esc((byId(BASES,PICK.base)||BASES[0]).n[lang])}</span></div>
      <div class="dolls" id="dolls">${
        BASES.map(b=>`<button class="doll ${b.id===PICK.base?'on':''}" data-b="${b.id}">
          <img src="${b.src}" alt="${esc(b.n[lang])}">
          <span>${esc(b.n[lang])}</span></button>`).join('')}</div>
    </section>

    <section>

        <span class="lt">${esc(n.s2)}</span>

      <div class="igrid" id="igrid">${

          return `<button class="it ${on?'on':''}" data-i="${it.id}">
            <span class="ph"><img src="${it.src}" alt=""></span>
            <span>${esc(it.n[lang])}</span></button>`;
        }).join('')}</div>
    </section>

    <section>
      <div class="lab"><span class="no" style="background:${C.purple}">3</span>
        <span class="lt">${esc(n.s3)}</span></div>
      <div class="sw" id="sw">${
        WIRES.map(c=>`<button data-w="${c}" class="${c===PICK.wire?'on':''}"
          style="background:${c}"></button>`).join('')}</div>
    </section>

    <section>
      <div class="lab"><span class="no" style="background:#D9A417">4</span>
        <span class="lt">${esc(n.s4)}</span></div>
      <div class="picked" id="picked">${
        cnt ? PICK.items.map(p=>{
          const it = byId(ITEMS, p.id);
          return `<div class="pr">
            <span class="th"><img src="${it.src}" alt=""></span>

              `<button data-sid="${p.id}" data-spot="${s}" class="${(p.x==null && p.spot===s)?'on':''}">${esc(SPOTS[s].n[lang])}</button>`).join('')}
              ${p.x!=null ? `<button class="rst" data-rst="${p.id}">${esc(n.resetPos)}</button>` : ''}</span>
          </div>`;
        }).join('') : `<div class="empty">${esc(n.pickFirst)}</div>`}</div>

  $('#cuFoot').innerHTML = `<div>
      <div class="bp">${won(customPrice())}</div>
      <div class="bd">${esc(n.items(Math.max(1,cnt)))}</div>
    </div>
    <button class="go" id="goBtn">${esc(n.go)}</button>`;

  $('#dolls').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ setBase(b.dataset.b); spark(); render(); });
  $('#igrid').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(toggleItem(b.dataset.i)) spark(); render(); });
  $('#sw').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ PICK.wire=b.dataset.w; render(); });
  $('#picked').querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{
    setSpot(b.dataset.sid, b.dataset.spot); spark(2); render(); });
  $('#picked').querySelectorAll('[data-rst]').forEach(b=>b.onclick=()=>resetPos(b.dataset.rst));
  $('#goBtn').onclick = showRecap;
}

/* ── 카운터에 보여주는 요약 ── */
function showRecap(){
  const n = NAV[lang], t = T[lang];
  const b = byId(BASES, PICK.base) || BASES[0];
  const shot = `<div class="shot"><div class="in">
      <img class="body" src="${b.src}" alt="">
      ${PICK.items.map(p=>{
        const it = byId(ITEMS,p.id), a = posOf(p, b);
        return `<div class="worn" style="position:absolute;width:${it.w*100}%;
          left:${a[0]*100}%;top:${a[1]*100}%;
          transform:translate(-50%,-50%) rotate(${it.r}deg)">
          <img src="${it.src}" style="width:100%" alt=""></div>`;
      }).join('')}
    </div></div>`;

  $('#cuSheetIn').innerHTML = `<h4><span class="dot"></span>${esc(n.recapT)}</h4>
    <div class="recap">
      ${shot}
      <div class="row"><span class="k">${esc(n.rColor)}</span>
        <span class="v">${esc(b.n[lang])}</span></div>
      <div class="row"><span class="k">${esc(n.rItem)}</span>

      <div class="tot"><span class="k">${esc(n.total)}</span><b>${won(customPrice())}</b></div>
    </div>
    <div class="steps">${
      t.steps.map((s,i)=>`<div class="st"><span class="n">${i+1}</span>

  /* 구매 버튼은 스크롤과 상관없이 항상 화면에 보이도록 별도 푸터에 넣습니다.
     스마트스토어 상품 페이지에서 아이템·와이어링 옵션을 직접 고르시면 되므로
     별도 주문 메모는 필요 없습니다. */
  $('#cuSheetFoot').innerHTML = `
    <a class="shopBtn" id="shopBtn" href="${SHOP_URL}" target="_blank" rel="noopener">
      ${esc(n.shopT)} <span class="ar">↗</span></a>
    <div class="tip instore">${esc(n.shopS)}</div>
    <button id="cuClose">${esc(n.close)}</button>`;

  cu.classList.add('sheet');

  $('#cuClose').onclick = closeSheet;
}
function closeSheet(){ cu.classList.remove('sheet'); }

/* ══════════ 언어 ══════════ */
function langButtons(el){
  const cols = [C.pinkL, C.tealL, C.yellowL, C.purpleL, C.blueL];
  el.innerHTML = Object.values(T).map((l,i)=>
    `<button class="lb${i===4?' wide':''}" data-l="${l.code}" style="background:${cols[i]}">${l.label}</button>`).join('');
  [...el.children].forEach(b => b.onclick = () => chooseLang(b.dataset.l));
}
function chooseLang(l){
  lang = l;
  document.documentElement.lang = {ko:'ko',en:'en',cn:'zh-CN',tw:'zh-TW',jp:'ja'}[l];
  $('#cuLangBtn').textContent = T[l].label;
  $('#cuTitle').textContent = NAV[l].studioT;
  $('#resetBtn').textContent = NAV[l].reset;
  $('#cuLangSheet').classList.remove('on');
  $('#cuLangSheet h5').textContent = T[l].sheetT;
  $('#backBtn').setAttribute('aria-label', NAV[l].back);
  try{ sessionStorage.setItem('nj-lang', l); }catch(_){}
  closeSheet(); render();
}

/* ══════════ 시작 ══════════ */
langButtons($('#cuLangs'));
$('#cuLangBtn').onclick = () => $('#cuLangSheet').classList.add('on');
$('#cuLangSheet').onclick = e => { if(e.target.id === 'cuLangSheet') e.target.classList.remove('on'); };
$('#cuDim').onclick = closeSheet;
$('#cuGrab').onclick = closeSheet;
$('#resetBtn').onclick = resetAll;
$('#backBtn').onclick = () => {
  if(window.njCloseCustom){ window.njCloseCustom(); return; }
  let embedded = false;
  try{ embedded = window.self !== window.top; }catch(_){ embedded = true; }
  if(embedded){ try{ parent.postMessage({type:'nj:back'},'*'); return; }catch(_){} }
  if(history.length > 1) history.back();
  else location.href = 'home.html';
};




/* ════════════════════════════════════════════════════════════════
   인형·아이템 사진 — 아주 깁니다. 아래로 쭉 넘기세요
   ════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   커스텀 조각 — 매장 실물 사진에서 배경만 걷어낸 것입니다.

   인형마다 사진 속 자세와 크기가 조금씩 달라서,
   각 인형의 **눈 위치(eye)** 를 재어 두고 그것을 기준으로
   아이템 자리를 계산합니다. 그래야 안경이 늘 눈에 맞습니다.

   OFFSET  눈에서 얼마나 떨어진 자리인지 (인형 크기 대비)
   ITEMS.w 인형 너비 대비 아이템 너비   ITEMS.r  기울기(도, 시계 방향)

   손님이 손으로 끌어 옮기면 이 값 대신 그 자리를 씁니다.
   ══════════════════════════════════════════════════════════════ */

/* 붙일 자리 — 눈을 기준으로 얼마나 떨어져 있는지 */
/* 열 마리를 재어 보니 비율이 거의 같았습니다.
   머리 꼭대기는 눈에서 -0.36, 팔 바깥선은 좌우로 0.48 쯤입니다.
   팔에 드는 물건은 바깥선보다 조금 안쪽(0.36)에 놓아야 붕 뜨지 않습니다. */
const OFFSET = {
  face : [ 0.00,  0.00],   // 눈 그 자리
  head : [ 0.00, -0.24],   // 귀 사이 오목한 곳
  chest: [ 0.00,  0.33],   // 배 한가운데. 0.20 이면 턱 바로 밑에 붙습니다
  left : [-0.30,  0.26],   // 왼팔 언저리
  right: [ 0.30,  0.26],   // 오른팔 언저리
};

const SPOTS = {
  face   : { n:{ko:'얼굴', en:'Face', cn:'脸', tw:'臉', jp:'顔'} },
  head   : { n:{ko:'머리 위', en:'On the head', cn:'头顶', tw:'頭頂', jp:'頭の上'} },
  chest  : { n:{ko:'가슴', en:'Chest', cn:'胸前', tw:'胸前', jp:'胸'} },
  left   : { n:{ko:'왼손', en:'Left hand', cn:'左手', tw:'左手', jp:'左手'} },
  right  : { n:{ko:'오른손', en:'Right hand', cn:'右手', tw:'右手', jp:'右手'} },
};

/* 인형 종류 */
const KIND = {
  togom : {ko:'토곰', en:'Togom', cn:'兔熊', tw:'兔熊', jp:'トゴム'},
  cat   : {ko:'고양이', en:'Cat', cn:'猫咪', tw:'貓咪', jp:'ねこ'},
};

/* 인형 — eye 는 사진에서 잰 눈 위치입니다 */
const BASES = [
